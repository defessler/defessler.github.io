  .paltools { display: flex; align-items: center; gap: 6px; margin: 6px 8px; flex-shrink: 0; min-width: 0; }

    flex: 1; min-width: 0; background: var(--mk-gutter); color: var(--mk-fg);
    border: 1px solid var(--mk-border); border-radius: var(--radius);
    padding: 4px 6px; font-family: var(--font); font-size: 12px;
  }
  .paltools input:focus { outline: none; border-color: var(--mk-cyan); }
  /* Chrome's fixed placeholder gray never adapted to a theme: measured against
     the field background, every shipped theme fell short of AA (worst 3.04:1,
     best 4.35:1). Mixed toward --mk-fg rather than left at --mk-comment, tuned
     so even the tightest theme (Solarized Light) clears 4.5:1. */
  ::placeholder { color: color-mix(in srgb, var(--mk-fg) 98%, var(--mk-comment)); opacity: 1; }
  .paltools button {
    background: transparent; color: var(--mk-comment); border: 1px solid var(--mk-border);
    border-radius: var(--radius); padding: 4px 7px; cursor: pointer;
    font-family: var(--font); font-size: 11px; white-space: nowrap;
    /* At the minimum dock width "Collapse All" (86px) outgrew its ~62px box
       and spilled across its neighbor instead of stopping at the edge, the
       same overflow #palette button .lbl already guards against. */
    max-width: 100%; overflow: hidden; text-overflow: ellipsis;
  }
  .paltools button:hover:not(:disabled) { color: var(--mk-cyan); border-color: var(--mk-cyan); }
  /* shown but dead rather than hidden, so the pair doesn't jump around.
     --mk-comment at 0.38 opacity measured 1.36-1.9:1 against the workspace
     background on every theme; even --mk-comment at FULL opacity falls short
     of 3:1 on five themes (one-dark 2.32, tokyo-night 2.76, ...), so opacity
     alone could never clear the floor. --mk-fg at 0.78 does, on all eleven. */
  .paltools button:disabled { opacity: 0.78; color: var(--mk-fg); cursor: default; }
  .paltools.tight { margin-top: 0; flex-wrap: wrap; }
  .paltools.tight button { flex: 1 1 60px; min-width: 0; text-align: center; }
  .filterwrap { position: relative; display: flex; flex: 1; min-width: 0; }
  .clearfilter {
    position: absolute; right: 3px; top: 50%; transform: translateY(-50%);
    display: none; background: transparent; border: none; color: var(--mk-comment);
    cursor: pointer; font-family: var(--font); font-size: 10px; padding: 2px 4px; line-height: 1;
  }
  .clearfilter:hover { color: var(--mk-pink); }
  /* only worth offering once there is something to clear */
  .filterwrap.filled:hover .clearfilter, .filterwrap.filled:focus-within .clearfilter { display: block; }
  .filterwrap.filled input { padding-right: 22px; }
  /* The ellipsis lives on an inner span, not the button: Chrome collapses a
     <button>'s content box to zero height when overflow:hidden is set on the
     button itself, which silently squashes the whole palette. */
  #palette button {
    background: var(--mk-surface); color: var(--mk-fg); border: 1px solid var(--mk-border);
    border-radius: var(--radius); padding: 6px 12px; cursor: grab; font-size: 12px;
    line-height: 1.4; font-family: var(--font); user-select: none; text-align: center;
    transition: background 0.1s, color 0.1s, border-color 0.1s;
  }
  #palette button .lbl {
    display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #palette button:hover {
    background: color-mix(in srgb, var(--mk-cyan) 16%, var(--mk-surface));
    color: var(--mk-cyan); border-color: var(--mk-cyan);
  }
  #palette button:active { background: var(--mk-gutter); }
  /* offered but not usable yet: the tooltip and (on click or Enter) the status
     line say what is missing. 0.38 measured ~1:1 on the two light themes,
     near-invisible; 0.78 clears 3:1 everywhere. */
  #palette button.blocked {
    opacity: 0.78; cursor: not-allowed; background: transparent;
  }
  #palette button.blocked:hover {
    /* suppress the normal cyan hover look, but keep the same readable text
       color the resting state uses rather than dropping to --mk-comment */
    background: transparent; border-color: var(--mk-border);
  }

  #tree { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 0; }
  .row {
    display: flex; align-items: center; padding: 2px 8px 2px 6px; cursor: pointer; gap: 5px;
    border-left: 2px solid transparent;
    /* a reorder drag starts on a row, and without this it selects the label
       text of every row it passes over */
    user-select: none;
  }
  .row:hover { background: var(--mk-hover); }
  .row.selected { background: var(--mk-surface); border-left-color: var(--mk-pink); }
  .row.selected .wlabel { color: var(--mk-pink); }
  /* The type label yields before the row's own buttons do. It was flex-shrink:0
     against an overflow-x:hidden panel, so at a narrow left dock it held its
     full width and pushed the per-row move and delete buttons off the edge,
     where nothing scrolls and they could not be reached at all. */
  .row .wtype {
    color: var(--mk-cyan); font-size: 11px; opacity: 0.8;
    flex-shrink: 1; min-width: 0; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }
  .row .wlabel { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; opacity: 0.85; }
  .row .join { color: var(--mk-yellow); font-size: 12px; }
  .row .box { color: var(--mk-purple); font-size: 11px; }
  .row button {
    background: none; border: none; color: var(--mk-comment); cursor: pointer;
    padding: 0 2px; font-size: 12px; font-family: var(--font);
  }
  .row button:hover { color: var(--mk-fg); }

  /* The column is sized to the longest label, so these do not wrap. Anything
     longer that turns up later ellipsizes rather than silently going to two
     lines, and the full text is on the tooltip. */
  #propbody label {
    color: var(--mk-comment); font-size: 12px; line-height: 1.25;
    min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* stacked in a narrow dock there is a whole row to use, so let it wrap there */
  @container (max-width: 250px) {
    #propbody label { white-space: normal; overflow-wrap: anywhere; }
  }
  #propbody input[type=text], #propbody input[type=number], #propbody select,
  #propbody textarea.longtext {
    background: var(--mk-gutter); color: var(--mk-fg); border: 1px solid var(--mk-border);
    border-radius: var(--radius); padding: 3px 6px; width: 100%; min-width: 0;
    font-family: var(--font); font-size: 12px;
  }
  /* a Raw block's code and a window's preamble are several lines of C++, so the
     field they are edited in has to be able to hold a newline */
  #propbody textarea.longtext { resize: vertical; line-height: 1.45; }
  #propbody textarea.longtext:focus { outline: none; border-color: var(--mk-cyan); }
  /* a narrow dock must be able to squeeze these rather than overflow */
  #propbody > * { min-width: 0; }
  .veccell input, .numwrap input { min-width: 0; }
  #propbody input:focus, #propbody select:focus { outline: none; border-color: var(--mk-cyan); }
  #propbody .empty { grid-column: 1 / -1; color: var(--mk-comment); padding: 6px 0; }
  #propbody .empty::before { content: '// '; }

  /* ---- properties: sections, a real toggle, readable color rows ---- */
  .prophead {
    grid-column: 1 / -1; display: flex; align-items: center; gap: 6px;
    margin: 10px 0 2px; color: var(--mk-green); font-size: 10px;
    text-transform: uppercase; letter-spacing: 0.08em;
  }
  .prophead:first-child { margin-top: 0; }
  .prophead::after { content: ''; flex: 1; height: 1px; background: var(--mk-border); }
  .propident {
    grid-column: 1 / -1; display: flex; align-items: baseline; gap: 7px;
    padding-bottom: 4px; border-bottom: 1px solid var(--mk-border); margin-bottom: 2px;
  }
  .propident b { color: var(--mk-cyan); font-size: 13px; font-weight: 600; }
  .propident span { color: var(--mk-comment); font-size: 11px; }
  /* a switch rather than a bare checkbox: SameLine is the one flag people
     reach for constantly, so it gets a control you can hit */
  .toggle {
    display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
    color: var(--mk-comment); font-size: 11px; user-select: none;
  }
  .toggle .track {
    width: 30px; height: 16px; border-radius: 9px; background: var(--mk-gutter);
    border: 1px solid var(--mk-border); position: relative; transition: all 0.12s;
    flex-shrink: 0;
  }
  .toggle .track::after {
    content: ''; position: absolute; top: 1px; left: 1px; width: 12px; height: 12px;
    border-radius: 50%; background: var(--mk-comment); transition: all 0.12s;
  }
  .toggle.on .track { border-color: var(--mk-green); background: color-mix(in srgb, var(--mk-green) 18%, transparent); }
  .toggle.on .track::after { left: 15px; background: var(--mk-green); }
  .toggle.on { color: var(--mk-green); }
  /* a vector reads as one value, so w/h and min/max share a row */
  .vecrow { display: flex; gap: 6px; width: 100%; }
  .veccell { display: flex; align-items: center; gap: 4px; flex: 1; min-width: 0; }
  .vectag { color: var(--mk-comment); font-size: 10px; min-width: 12px; flex-shrink: 0; white-space: nowrap; }
  .numwrap { position: relative; display: flex; align-items: center; flex: 1; min-width: 0; }
  .numwrap input { width: 100%; }
  /* the unit sits inside the field rather than stealing a column */
  .numwrap .unit {
    position: absolute; right: 6px; color: var(--mk-comment); font-size: 10px;
    pointer-events: none;
  }
  .numwrap:has(.unit) input { padding-right: 26px; }

  .colorrow { display: flex; align-items: center; gap: 6px; }
  /* the swatch is the control, so the color fills it edge to edge and the
     border is the only chrome */
  .colorrow input[type=color] {
    width: 28px; height: 20px; padding: 0; border: 1px solid var(--mk-border);
    border-radius: var(--radius); background: transparent; cursor: pointer;
    -webkit-appearance: none; appearance: none; overflow: hidden;
  }
  .colorrow input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
  .colorrow input[type=color]::-webkit-color-swatch { border: none; border-radius: 1px; }
  .colorrow input[type=color]::-moz-color-swatch { border: none; border-radius: 1px; }
  .colorrow input[type=color]:hover { border-color: var(--mk-cyan); }
  .colorrow .hex { color: var(--mk-comment); font-size: 10px; letter-spacing: 0.02em; }
  .colorrow .unset {
    margin-left: auto; background: none; border: 1px solid var(--mk-border);
    color: var(--mk-comment); border-radius: var(--radius); font-family: var(--font);
    font-size: 10px; cursor: pointer; padding: 1px 5px;
  }
  .colorrow .unset:hover { color: var(--mk-pink); border-color: var(--mk-pink); }
  #propbody label.set { color: var(--mk-fg); font-weight: 600; }
  #propbody label.set::after { content: ' •'; color: var(--mk-green); }
  /* the field and its revert arrow share the value column */
  .fieldwrap { display: flex; align-items: center; gap: 4px; min-width: 0; }
  .fieldwrap > :first-child { flex: 1; min-width: 0; }
  /* ...but a checkbox has its own size, and flex: 1 overrode it: a changed bool
     came out as a wide empty box, and looked right again only once you clicked it
     back to its default and the revert wrapper went away. */
  .fieldwrap > input[type=checkbox]:first-child { flex: 0 0 auto; width: 15px; }
  #propbody .revert {
    background: transparent; border: none; color: var(--mk-comment); cursor: pointer;
    font-family: var(--font); font-size: 13px; line-height: 1; padding: 0 2px; flex: 0 0 auto;
  }
  #propbody .revert:hover { color: var(--mk-cyan); }

  /* The native checkbox only honors accent-color, which leaves its box the
     platform's gray on every theme. Drawn from scratch it can match. */
  input[type=checkbox] {
    -webkit-appearance: none; appearance: none; margin: 0;
    width: 15px; height: 15px; flex-shrink: 0; cursor: pointer;
    background: var(--mk-gutter); border: 1px solid var(--mk-border);
    border-radius: var(--radius); position: relative;
    transition: background 0.1s, border-color 0.1s;
  }
  input[type=checkbox]:hover { border-color: var(--mk-cyan); }
  input[type=checkbox]:checked { background: var(--mk-green); border-color: var(--mk-green); }
  input[type=checkbox]:checked::after {
    content: ''; position: absolute; left: 4px; top: 1px; width: 4px; height: 8px;
    border: solid var(--mk-bg); border-width: 0 2px 2px 0; transform: rotate(42deg);
  }
  input[type=checkbox]:focus-visible { outline: 1px solid var(--mk-cyan); outline-offset: 1px; }

  /* the old toolbar row is gone. Its actions live in the menu bar now */

  /* Rulers frame the canvas. The canvas itself fills whatever is left, and the
     wasm surface is resized to match rather than being a fixed box. */
  /* minmax(0, 1fr), not 1fr: a bare fr track floors at its content's min-content
     width, which is the canvas's explicit pixel size, so shrinking the window
     after growing it left the canvas sticking out over the right dock. */
  #canvasarea {
    flex: 1; min-height: 0; min-width: 0; display: grid;
    grid-template-columns: 20px minmax(0, 1fr) 20px;
    grid-template-rows: 20px minmax(0, 1fr) 20px;
    background: var(--mk-canvas);
    border: 1px solid var(--mk-border);
  }
  #canvasarea.norulers {
    grid-template-columns: 0 minmax(0, 1fr) 0;
    grid-template-rows: 0 minmax(0, 1fr) 0;
  }
  #canvasarea.norulers .ruler, #canvasarea.norulers .rulercorner { display: none; }
  /* Each corner carries the borders of the two rules it sits between, so the
     frame closes instead of showing four different joins. */
  .rulercorner { background: var(--mk-canvas); }
  #canvasarea > .rulercorner:nth-of-type(1) { border-right: 1px solid var(--mk-border); border-bottom: 1px solid var(--mk-border); }
  .ruler { display: block; background: var(--mk-canvas); }
  #rulerCorner { border-right: 1px solid var(--mk-border); border-bottom: 1px solid var(--mk-border); }
  #cornerTR { border-left: 1px solid var(--mk-border); border-bottom: 1px solid var(--mk-border); }
  #cornerBL { border-right: 1px solid var(--mk-border); border-top: 1px solid var(--mk-border); }
  #cornerBR { border-left: 1px solid var(--mk-border); border-top: 1px solid var(--mk-border); }
  #rulerTop { border-bottom: 1px solid var(--mk-border); cursor: ns-resize; }
  #rulerLeft { border-right: 1px solid var(--mk-border); cursor: ew-resize; }
  #rulerBottom { border-top: 1px solid var(--mk-border); cursor: ns-resize; }
  #rulerRight { border-left: 1px solid var(--mk-border); cursor: ew-resize; }
  /* The ground and the grid are painted here rather than by the engine. A
     repeating background has no edges, so the grid carries on for as far as you
     can pan. The wasm surface only ever covered the visible box. Tinting from
     --mk-fg means it inverts with the theme for free: light lines on a dark
     ground, dark lines on a light one. */
  #canvashost {
    position: relative; overflow: hidden; min-width: 0; min-height: 0;
    background-color: var(--mk-canvas);
    background-image:
      linear-gradient(to right, var(--mk-grid-major) 1px, transparent 1px),
      linear-gradient(to bottom, var(--mk-grid-major) 1px, transparent 1px),
      linear-gradient(to right, var(--mk-grid-minor) 1px, transparent 1px),
      linear-gradient(to bottom, var(--mk-grid-minor) 1px, transparent 1px);
    background-size: 100px 100px, 100px 100px, 20px 20px, 20px 20px;
  }
  #canvashost.nogrid { background-image: none; }
  /* origin at the top-left, not the default center: the pan is a world offset
     and the zoom has to scale about the same corner, or content slides sideways
     as it scales and no anchor math can hold a point still */
  #viewport { position: absolute; inset: 0; will-change: transform; transform-origin: 0 0; }
  /* transparent, so the ground above shows through everywhere the panel isn't */
  #canvas { background: transparent; outline: none; display: block; }
  #canvashost.panning { cursor: grabbing; }
  /* Ctrl+Alt held: the next press pans rather than selects, so say so up front */
  #canvashost.panready { cursor: grab; }
  #canvashost.panready.panning { cursor: grabbing; }
  /* #canvas itself keeps outline:none (a rectangle around a 4096px surface is
     not useful), so the indicator lives on the host instead: an inset ring
     that shows up for a keyboard focus arrival but not a mouse selection
     click, the same distinction #codeEditWrap:focus-within draws for the C++
     editor. `.kbd-focus` is toggled in canvas.js, which is the input-modality
     signal Chrome's own :focus-visible heuristic does not apply to a bare
     tabindexed <canvas> (it showed the ring for a mouse click too). */
  #canvashost.kbd-focus {
    box-shadow: inset 0 0 0 2px var(--mk-cyan);
  }
  /* live readout pinned near the cursor, the other half of a ruler */
  #coordtip {
    position: absolute; display: none; pointer-events: none; z-index: 6;
    background: var(--mk-bg); border: 1px solid var(--mk-border); border-radius: var(--radius);
    color: var(--mk-cyan); font-size: 11px; padding: 1px 5px; white-space: nowrap;
  }

  #guides { position: absolute; inset: 0; pointer-events: none; }
  .guide { position: absolute; background: var(--mk-cyan); pointer-events: auto; }
  .guide.gx { top: 0; bottom: 0; width: 1px; cursor: ew-resize; }
  .guide.gy { left: 0; right: 0; height: 1px; cursor: ns-resize; }
  .guide::after {
    content: ''; position: absolute; inset: -3px;
  }
  #marquee {
    position: absolute; display: none; pointer-events: none;
    border: 1px solid var(--mk-cyan); background: color-mix(in srgb, var(--mk-cyan) 10%, transparent);
  }

  /* ---- hotbar ---- */

  /* ---- collapsible palette sections ---- */
  .cat {
    color: var(--mk-comment); font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.07em; padding: 7px 4px 3px; cursor: pointer;
    grid-column: 1 / -1; display: flex; align-items: center; gap: 5px;
    user-select: none;
  }
  .cat:hover { color: var(--mk-fg); }
  /* the twisty is the click target for the whole row, so it wants to read as
     one rather than as punctuation */
  .cat .tw { font-size: 14px; width: 12px; line-height: 1; color: var(--mk-purple); }
  .cat::before { content: none; }

  /* ---- context menu ---- */
  #ctxmenu {
    position: fixed; display: none; z-index: 40; min-width: 190px; padding: 4px;
    background: var(--mk-surface); border: 1px solid var(--mk-border);
    border-radius: var(--radius); box-shadow: var(--shadow); font-size: 12.5px;
  }
  #ctxmenu .mi {
    display: flex; align-items: center; gap: 10px; padding: 5px 8px;
    border-radius: var(--radius); cursor: pointer; color: var(--mk-fg);
  }
  #ctxmenu .mi:hover { background: var(--mk-hover); }
  #ctxmenu .mi.danger { color: var(--mk-pink); }
  /* --mk-fg at 65%, not --mk-comment. The comment color is tuned to recede
     against the EDITOR background, and against the lighter popup surface it
     fell under 4.5:1 on several shipped themes. That is the one surface where
     the text is a key you are meant to read and memorize. */
  #ctxmenu .mi .k {
    margin-left: auto; font-size: 11px;
    color: color-mix(in srgb, var(--mk-fg) 82%, transparent);
  }
  #ctxmenu .sep { height: 1px; background: var(--mk-border); margin: 4px 2px; }
  #ctxmenu .hdr {
    padding: 4px 8px 5px; color: var(--mk-comment); font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.07em;
  }

  /* UMG's hover cue: a quiet dashed box under the pointer, distinct from
     the solid selection outline, gone the moment a gesture starts */
  #hoverbox {
    position: absolute; display: none; pointer-events: none;
    border: 1px dashed color-mix(in srgb, var(--mk-cyan) 55%, transparent);
  }
  /* segmented alignment control (UMG's alignment buttons) */
  .alignrow { display: inline-flex; gap: 0; }
  .alignrow .alignseg {
    padding: 2px 8px; border: 1px solid var(--mk-border); background: var(--mk-surface);
    color: var(--mk-comment); cursor: pointer; font: inherit; line-height: 1.2;
  }
  .alignrow .alignseg + .alignseg { border-left: none; }
  .alignrow .alignseg.on { color: var(--mk-bg); background: var(--mk-cyan); border-color: var(--mk-cyan); }
  .alignrow .alignseg:hover:not(.on) { color: var(--mk-fg); }
  /* hierarchy visibility eye; a hidden widget dims its whole row */
  #tree .row .eye { opacity: 0.75; }
  #tree .row.dimrow .wtype, #tree .row.dimrow .wlabel { opacity: 0.45; }
  #selbox {
    position: absolute; display: none; pointer-events: none;
    border: 1px solid var(--mk-cyan);
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--mk-cyan) 30%, transparent), 0 0 12px color-mix(in srgb, var(--mk-cyan) 15%, transparent);
  }
  /* secondary members of a multi-selection: same hue, quieter */
  #selboxes { position: absolute; inset: 0; pointer-events: none; }
  #selboxes .sb {
    position: absolute; border: 1px dashed var(--mk-cyan); opacity: 0.75;
  }
  /* Right / bottom / corner only: the flow cursor pins the left and top edges,
     so a left or top handle would be a control that resists the drag. */
  .rh {
    position: absolute; width: 8px; height: 8px; background: var(--mk-cyan);
    border: 1px solid var(--mk-bg); pointer-events: auto; display: none;
  }
  #selbox.resizable .rh { display: block; }
  #selbox.resizable .rh-r { right: -5px; top: 50%; margin-top: -4px; cursor: ew-resize; }
  #selbox.resizable .rh-b { bottom: -5px; left: 50%; margin-left: -4px; cursor: ns-resize; }
  #selbox.resizable .rh-c { right: -5px; bottom: -5px; cursor: nwse-resize; }
  /* A widget sits in a flow, so its left and top edges are pinned and only the
     far edges can move. A window is placed, so all eight grips apply. */
  #selbox.resizable.win .rh-l { left: -5px; top: 50%; margin-top: -4px; cursor: ew-resize; }
  #selbox.resizable.win .rh-t { top: -5px; left: 50%; margin-left: -4px; cursor: ns-resize; }
  #selbox.resizable.win .rh-tl { left: -5px; top: -5px; cursor: nwse-resize; }
  #selbox.resizable.win .rh-tr { right: -5px; top: -5px; cursor: nesw-resize; }
  #selbox.resizable.win .rh-bl { left: -5px; bottom: -5px; cursor: nesw-resize; }
  /* :not(.win) rather than a bare descendant rule. `#selbox.resizable .rh` is
     one id and two classes and was winning, so the five window-only grips
     rendered on EVERY resizable widget, stacked on its top-left corner. */
  #selbox:not(.win) .winonly { display: none; }
  #selbox.noh .rh, #selbox.now .rh-r, #selbox.now .rh-c { display: none; }
  #selbox.noh .rh-r { display: block; }
  /* a forgiving grab area around each grip, so aiming at an edge does not land
     on the canvas and start a selection instead */
  .rh::after { content: ''; position: absolute; inset: -5px; }

  #inlineEdit {
    position: absolute; display: none; z-index: 12; padding: 1px 3px;
    background: var(--mk-gutter); color: var(--mk-fg);
    border: 1px solid var(--mk-cyan); border-radius: 2px;
    font-family: var(--font); font-size: 13px; outline: none;
  }
  #dropline {
    position: absolute; display: none; pointer-events: none;
    background: var(--mk-yellow);
    box-shadow: 0 0 6px color-mix(in srgb, var(--mk-yellow) 40%, transparent);
  }
  #dropbox {
    position: absolute; display: none; pointer-events: none;
    border: 1px dashed var(--mk-yellow); background: color-mix(in srgb, var(--mk-yellow) 7%, transparent);
  }
  #ghost {
    position: fixed; display: none; pointer-events: none; z-index: 10;
    background: var(--mk-surface); border: 1px solid var(--mk-cyan); border-radius: var(--radius);
    padding: 3px 8px; font-size: 12px; color: var(--mk-fg); box-shadow: var(--shadow);
  }
  /* No valid drop target under the pointer right now: say so on the ghost
     itself, mid-drag, rather than only in the silence after a release that
     inserts nothing. */
  #ghost.nodrop { opacity: 0.45; border-color: var(--mk-comment); box-shadow: none; }

  /* wrap, so a narrow code panel puts the buttons on a second line rather than
     pushing them off the right edge where nothing scrolls and nobody can click
     them. The dock goes down to 150px and the header wants about 290. */
  #codehead {
    display: flex; align-items: center; flex-wrap: wrap;
    border-bottom: 1px solid var(--mk-border); flex-shrink: 0;
  }
  /* Only the spacing here: the shared select rule above owns the look, and a
     second full declaration was quietly stripping its arrow.
     min-width:0 because a select's automatic minimum is its widest OPTION, so
     without this it refuses to shrink and shoves everything after it out. */
  #codehead select { margin: 4px 0 4px 8px; min-width: 0; }
  #codehead button {
    /* Edit/Copy/etc. measured 2.97:1 on Solarized Light; same floor as .brand */
    margin: 4px 8px; background: transparent; color: color-mix(in srgb, var(--mk-fg) 20%, var(--mk-green));
    border: 1px solid color-mix(in srgb, var(--mk-fg) 20%, var(--mk-green)); border-radius: var(--radius);
    padding: 4px 12px; cursor: pointer; font-size: 12px; font-family: var(--font);
    transition: background 0.15s, color 0.15s;
  }
  #codehead button::before { content: '$ '; color: var(--mk-comment); }
  #codehead button:hover { background: var(--mk-green); color: var(--mk-bg); }
  #codehead button:hover::before { color: var(--mk-bg); }

  /* Structural only: colors come from the generated #themeStyle rules */
  #code {
    flex: 1; margin: 0; padding: 12px; overflow: auto; font: 12px/1.5 var(--font);
    white-space: pre; user-select: text;
  }
  /* Highlighting while editing: a highlighted <pre> sits under a transparent
     <textarea>. Both use identical metrics so the glyphs line up exactly, and
     the textarea keeps real caret, selection, undo and IME behavior. */
  #codeEditWrap { flex: 1; position: relative; min-height: 0; overflow: hidden; }
  #codeEditHl, #codeEdit {
    position: absolute; inset: 0; margin: 0; padding: 12px;
    font: 13px/1.5 var(--font); white-space: pre; overflow: auto;
    border: none; tab-size: 4;
  }
  #codeEditHl { pointer-events: none; z-index: 0; }
  #codeEdit {
    z-index: 1; resize: none; outline: none; background: transparent;
    color: transparent; caret-color: var(--mk-fg);
  }
  #codeEdit::selection { background: color-mix(in srgb, var(--mk-cyan) 28%, transparent); color: transparent; }
  #codeEditWrap:focus-within { box-shadow: inset 2px 0 0 var(--mk-green); }
  .cline.hl { background: color-mix(in srgb, var(--mk-cyan) 18%, transparent); border-radius: 2px; }
  /* the selected widget's lines, marked in the code the same way the canvas and
     the hierarchy mark it */
  .cline.sel {
    background: color-mix(in srgb, var(--mk-green) 13%, transparent);
    box-shadow: inset 2px 0 0 var(--mk-green);
    border-radius: 0 2px 2px 0;
  }
  /* completion picker, floating over the editor at the caret */
  #codeCompl {
    position: absolute; z-index: 3; max-height: 220px; overflow-y: auto;
    min-width: 260px; max-width: min(560px, 90%);
    /* --panel is defined nowhere: an undefined custom property makes the
       declaration invalid at computed-value time, so this was always
       transparent and the picker painted straight over the code text. */
    background: var(--mk-surface); border: 1px solid var(--mk-border);
    border-radius: 4px; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
    font: 12px/1.4 var(--font);
  }
  #codeCompl .ci {
    padding: 4px 8px; cursor: pointer; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  #codeCompl .ci .cname { color: var(--mk-green); }
  #codeCompl .ci .csig { color: var(--mk-comment); margin-left: 8px; }
  #codeCompl .ci.on { background: color-mix(in srgb, var(--mk-cyan) 22%, transparent); }
  #codeCompl .ci.on .csig { color: var(--mk-fg); }

  /* the signature of the call the caret is inside */
  #codeSig {
    padding: 4px 10px; font: 12px/1.4 var(--font); flex-shrink: 0;
    border-top: 1px solid var(--mk-border);
    color: var(--mk-comment); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #codeSig b { color: var(--mk-cyan); font-weight: 600; }
  #codeSig .arg { color: var(--mk-yellow, var(--fg)); text-decoration: underline; }

  #codeLint {
    flex-shrink: 0; max-height: 28%; overflow-y: auto; font-size: 12px;
    border-top: 1px solid var(--mk-border);
  }
  #codeLint .ld {
    display: flex; gap: 8px; align-items: baseline;
    padding: 3px 10px; cursor: pointer;
  }
  #codeLint .ld:hover { background: var(--mk-hover); }
  #codeLint .ld .lat { color: var(--mk-comment); flex-shrink: 0; font-variant-numeric: tabular-nums; }
  #codeLint .ld .lmsg { flex: 1; }
  #codeLint .ld.error .lic { color: var(--mk-pink); }
  #codeLint .ld.warn .lic { color: var(--mk-orange, var(--mk-yellow)); }
  #codeLint .ld.info .lic { color: var(--mk-cyan); }
  #codeLint .ld .lic { flex-shrink: 0; }
  #codeLint .lfix {
    flex-shrink: 0; background: none; border: 1px solid var(--mk-border);
    color: var(--mk-green); border-radius: 3px; padding: 1px 6px;
    font: 11px var(--font); cursor: pointer;
  }
  #codeLint .lfix:hover { border-color: var(--mk-green); background: var(--mk-hover); }
  #codeLint .lclean { padding: 3px 10px; color: var(--mk-green); }

  /* The zoom group sits in the status bar, in the space the engine line used to
     take. It reads as one segmented control rather than three loose buttons. */
  #zoomctl { display: inline-flex; align-items: stretch; flex-shrink: 0; }
  #zoomctl button {
    /* --mk-comment measured 2.32-3.36:1 against the status bar on 9 of 11
       themes. Mixed toward --mk-fg the same way the popup shortcut badges
       were (4c51b16), tuned so the tightest theme clears 4.5:1. */
    background: transparent; color: color-mix(in srgb, var(--mk-fg) 90%, var(--mk-comment));
    border: 1px solid var(--mk-border); border-radius: 0; margin: 0;
    padding: 1px 7px; cursor: pointer; font-family: var(--font); font-size: 11px;
    line-height: 1.5; white-space: nowrap;
  }
  /* Neighbors overlap by their shared border rather than one of them dropping
     it. Removing the left border left the middle and right buttons with only
     three sides lit on hover, since there was no left edge to color. */
  #zoomctl button + button { margin-left: -1px; }
  #zoomctl button:first-child { border-radius: var(--radius) 0 0 var(--radius); }
  #zoomctl button:last-child { border-radius: 0 var(--radius) var(--radius) 0; }
  /* the hovered one draws its whole outline over its neighbor's edge */
  #zoomctl button:hover {
    color: var(--mk-cyan); border-color: var(--mk-cyan);
    position: relative; z-index: 1;
  }
  #zoomctl .zbtn { min-width: 22px; text-align: center; }
  #zoomPctBtn {
    min-width: 46px; text-align: center; font-variant-numeric: tabular-nums;
  }

  /* Handles and the selection outline live inside the scaled viewport, so they
     counter-scale to keep the same size on screen. Without this they are specks
     at 25% and slabs at 400%. */
  #selbox .rh { transform: scale(var(--inv-zoom, 1)); }
  /* The inline label editor counter-scales its WHOLE box, not just a border:
     beginInlineEdit sizes it in screen pixels (floored at 80x18) and this
     transform cancels the ambient viewport zoom back out, so that size (and
     its 13px text) is what actually lands on screen at any zoom instead of
     being scaled a second time. Origin at 0,0 keeps the top-left corner, which
     beginInlineEdit already positioned at the widget, from moving. */
  #inlineEdit { transform: scale(var(--inv-zoom, 1)); transform-origin: 0 0; }
  /* borders scale with the viewport too, so a 1px outline turns into 4px at 400%
     and vanishes at 25% */
  #selbox { border-width: calc(1px * var(--inv-zoom, 1)); }
  #selboxes .sb { border-width: calc(1px * var(--inv-zoom, 1)); }
  /* The drop indicator and the marquee live in the same scaled viewport and were
     left out of this, so the line you drag a widget against was half a pixel at
     25% and an eight-pixel slab at 400%. The dropline's thickness is set in JS
     (updateDropIndicator) and counter-scales there. */
  #marquee { border-width: calc(1px * var(--inv-zoom, 1)); }
  #dropbox { border-width: calc(2px * var(--inv-zoom, 1)); }

  #codeStatus {
    padding: 6px 10px; font-size: 12px; border-top: 1px solid var(--mk-border);
    color: var(--mk-comment); max-height: 32%; overflow-y: auto; white-space: pre-wrap;
  }
  #codeStatus.err { color: var(--mk-pink); }
  #codeStatus.ok { color: var(--mk-green); }

  #status {
    display: flex; align-items: center; gap: 12px;
    padding: 4px 12px; font-size: 12px; color: var(--mk-comment);
    border-top: 1px solid var(--mk-border); flex-shrink: 0;
  }
  #status .spacer { flex: 1; }
  #hoverInfo { color: var(--mk-fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #hoverInfo::before { content: '// '; color: var(--mk-comment); }
  #hoverInfo b { color: var(--mk-cyan); font-weight: 600; }
  #hoverInfo i { color: var(--mk-comment); font-style: normal; }
  #armInfo { color: var(--mk-green); white-space: nowrap; }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--mk-border); border-radius: 5px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--mk-comment); }

  #palette button { position: relative; }
  #palette button .kbd {
    position: absolute; top: 0; right: 4px; font-size: 10px; color: var(--mk-comment);
  }
  #palette button.armedbtn { color: var(--mk-green); border-color: var(--mk-green); }

  /* ---- menu bar ---- */
  /* Desktop-menu behavior: a click opens, and once something is open, hover
     moves between menus without another click. That is what every OS menu bar
     does and what people expect the moment a bar exists. */
  #menubar { display: flex; align-items: stretch; gap: 1px; height: 100%; }
  .menutop {
    /* File/View/Windows/Help measured 2.33:1 on Solarized Light against the
       header bar; same --mk-fg mix as the placeholder text below, which sits
       on the same gutter background. */
    background: transparent; border: none; color: color-mix(in srgb, var(--mk-fg) 98%, var(--mk-comment));
    font-family: var(--font); font-size: 12px; padding: 0 11px; cursor: pointer;
    border-radius: var(--radius);
  }
  .menutop:hover { color: var(--mk-fg); background: var(--mk-hover); }
  .menutop.open { color: var(--mk-bg); background: var(--mk-green); }
  /* The one call to action on the bar. Filled, so it reads as a button among
     labels rather than a fifth menu, and it keeps the bar's own metrics so it
     still sits on the baseline with File, View, Windows and Help. */
  .menutop.cta {
    background: var(--mk-cyan); color: var(--mk-bg); font-weight: 600;
    margin: 4px 0 4px 8px; padding: 0 12px; align-self: center;
  }
  .menutop.cta:hover {
    background: var(--mk-fg); color: var(--mk-bg);
  }
  .menutop.cta:focus-visible { outline: 2px solid var(--mk-fg); outline-offset: 2px; }
  #menupop {
    position: fixed; display: none; z-index: 45; min-width: 216px; padding: 4px;
    background: var(--mk-surface); border: 1px solid var(--mk-border);
    border-radius: var(--radius); box-shadow: var(--shadow); font-size: 12px;
  }
  #menupop .mi {
    display: flex; align-items: center; gap: 12px; padding: 5px 8px;
    border-radius: var(--radius); cursor: pointer; color: var(--mk-fg);
  }
  #menupop .mi:hover { background: var(--mk-hover); }
  #menupop .mi.disabled { opacity: 0.4; cursor: default; }
  #menupop .mi.disabled:hover { background: transparent; }
  /* the row ArrowUp/Down is currently on, same look as a mouse hover since
     there is no real DOM focus to draw a native ring around */
  #menupop .mi.sel { background: var(--mk-hover); }
  #menupop .mi .k {
    margin-left: auto; font-size: 11px; white-space: nowrap;
    color: color-mix(in srgb, var(--mk-fg) 82%, transparent);
  }
  /* the tick column keeps labels aligned whether or not a row is checkable */
  #menupop .mi .tick { width: 10px; color: var(--mk-green); }
  #menupop .sep { height: 1px; background: var(--mk-border); margin: 4px 2px; }
  #menupop .hdr {
    padding: 5px 8px 3px; color: var(--mk-comment); font-size: 10px;
    text-transform: uppercase; letter-spacing: 0.07em;
  }
  .headbtn {
    /* same header-bar contrast fix as .menutop, just below */
    background: transparent; color: color-mix(in srgb, var(--mk-fg) 98%, var(--mk-comment)); border: 1px solid var(--mk-border);
    border-radius: var(--radius); padding: 3px 10px; cursor: pointer;
    font-family: var(--font); font-size: 11px; white-space: nowrap;
  }
  .headbtn:hover { color: var(--mk-cyan); border-color: var(--mk-cyan); }
  /* The hint is the one thing on this bar that can afford to go. It used to
     wrap instead of yielding, so at a narrow width it kept its own two lines
     and pushed Share and Reset view off the right edge, where nothing scrolls
     and they cannot be clicked. Truncate, then disappear entirely rather than
     showing a useless stub. Same fix the palette's hover readout already has. */
  #apphead #modeHint {
    /* 2.33-4.47:1 across nine themes with plain --mk-comment. Sits on
       #apphead's gutter background, not the workspace background #zoomctl
       button/.tplcount do, so it needs their tighter 98% mix (menutop's,
       just above), not their 90%. */
    color: color-mix(in srgb, var(--mk-fg) 98%, var(--mk-comment)); font-size: 11px;
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  @media (max-width: 900px) { #apphead #modeHint { display: none; } }
  #apphead #modeHint b { color: var(--mk-green); }
  #apphead #modeHint.livehint { color: var(--mk-pink); }

  .overlay {
    position: fixed; inset: 0; background: var(--mk-backdrop);
    display: flex; align-items: flex-start; justify-content: center; z-index: 20;
  }
  .overlay[hidden] { display: none; }
  .overlay-box {
    margin-top: 11vh; width: 500px; max-height: 64vh; display: flex; flex-direction: column;
    background: var(--mk-surface); border: 1px solid var(--mk-border);
    border-radius: var(--radius); box-shadow: var(--shadow);
  }
  .overlay-box input {
    margin: 8px; padding: 6px 8px; background: var(--mk-gutter); color: var(--mk-fg);
    border: 1px solid var(--mk-border); border-radius: var(--radius);
    font-family: var(--font); font-size: 13px;
  }
  .overlay-box input:focus { outline: none; border-color: var(--mk-cyan); }
  .ov-list { overflow-y: auto; padding: 0 4px 6px; }
  .ov-item {
    display: flex; gap: 8px; padding: 4px 8px; cursor: pointer;
    border-radius: var(--radius); align-items: baseline;
  }
  .ov-item.sel, .ov-item:hover { background: var(--mk-hover); }
  .ov-item .k {
    margin-left: auto; font-size: 11px; white-space: nowrap;
    color: color-mix(in srgb, var(--mk-fg) 82%, transparent);
  }
  .ov-cat {
    color: var(--mk-comment); font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.07em; padding: 7px 8px 2px;
  }
  .ov-cat::before { content: '// '; }
</style>
<style id="themeStyle"></style>
</head>
<body>
  <div id="apphead">
    <span class="brand">Slate Studio</span><span class="ver" id="appVer" title="Studio version"></span>
    <nav id="menubar">
      <button class="menutop" data-menu="file" aria-haspopup="menu" aria-expanded="false">File</button>
      <button class="menutop" data-menu="view" aria-haspopup="menu" aria-expanded="false">View</button>
      <button class="menutop" data-menu="windows" aria-haspopup="menu" aria-expanded="false">Windows</button>
      <button class="menutop" data-menu="help" aria-haspopup="menu" aria-expanded="false">Help</button>
      <!-- Filled rather than another flat menu label: it is the one entry a
           first-time visitor should find without looking, and buried inside the
           Help menu nobody did. -->
      <button class="menutop cta" id="tutorialTopBtn"
        title="Open the tutorial in a new tab">Tutorial</button>
    </nav>
    <span class="spacer"></span>
    <span id="modeHint">hold <b>Space</b> to test interaction</span><!-- key filled in from the binding -->
    <button class="headbtn" id="shareTopBtn" title="Copy a link that carries this document">Share</button>
    <button class="headbtn" id="resetViewBtn" title="Recenter the canvas (Shift+F)">Reset view</button>
  </div>
  <div id="menupop" role="menu"></div>

  <div id="workspace">
    <!-- Panels start in the DOM (not a template) so element lookups elsewhere
         in the script work regardless of init order; buildPanels() wraps each
         one with a header in place and applyLayout() moves them per saved state. -->
    <div class="dock" id="dockTop"></div>
    <div class="dockresize horiz" id="resizeTop"></div>
    <div id="midrow">
    <div class="dock" id="dockLeft">
      <section class="panel" data-panel="palette" data-title="Palette">
        <div class="paltools">
          <span class="filterwrap">
            <input type="text" id="filter" placeholder="Filter widgets…">
            <button class="clearfilter" data-for="filter" title="Clear the filter">✕</button>
          </span>
        </div>
        <div class="paltools tight">
          <button id="palCollapseAll" title="Collapse every section">Collapse All</button>
          <button id="palExpandAll" title="Expand every section">Expand All</button>
        </div>
        <div id="palette"></div>
      </section>
      <section class="panel" data-panel="hierarchy" data-title="Hierarchy">
        <div class="paltools">
          <span class="filterwrap">
            <input type="text" id="treeFilter" placeholder="Filter hierarchy…">
            <button class="clearfilter" data-for="treeFilter" title="Clear the filter">✕</button>
          </span>
        </div>
        <div class="paltools tight">
          <button id="treeCollapseAll" title="Collapse every container">Collapse All</button>
          <button id="treeExpandAll" title="Expand every container">Expand All</button>
        </div>
        <div id="tree" role="tree"></div>
      </section>
      <section class="panel" data-panel="properties" data-title="Properties">
        <!-- tabindex so the command palette's "Focus properties" has a target
             even when nothing is selected and the panel holds no field yet -->
        <div id="propbody" tabindex="-1"></div>
      </section>
      <section class="panel" data-panel="templates" data-title="Templates">
        <!-- .tight: without it these three buttons stayed nowrap in an
             overflow-hidden panel, so at the minimum dock width Export was
             half clipped and Import sat entirely past the edge, unreachable. -->
        <div class="paltools tight">
          <button id="tplSaveBtn" title="Save the current document as a template">Save Current</button>
          <button id="tplExportBtn" title="Export templates to a file">Export</button>
          <button id="tplImportBtn" title="Import templates from a file">Import</button>
        </div>
        <div id="tpllist"></div>
      </section>
    </div>
    <div class="dockresize" id="resizeLeft"></div>

    <div id="center">
      <div id="projtabs"></div>
      <!-- These moved into the menu bar. The elements stay as hidden anchors so
           the menu items, the command palette and the self-test all keep one
           place to click, rather than three copies of each action. -->
      <div id="hiddenactions" hidden>
        <button id="gridBtn"></button>
        <button id="rulerBtn"></button>
        <button id="resetBtn"></button>
        <button id="shareBtn"></button>
        <button id="settingsBtn"></button>
        <button id="exportBtn"></button>
        <button id="importBtn"></button>
        <input type="file" id="importFile" accept=".json,application/json">
        <input type="file" id="importTplFile" accept=".json,application/json">
      </div>
      <div id="canvasarea">
        <div class="rulercorner" id="rulerCorner"></div>
        <canvas class="ruler" id="rulerTop"></canvas>
        <div class="rulercorner" id="cornerTR"></div>
        <canvas class="ruler" id="rulerLeft"></canvas>
        <div id="canvashost">
          <!-- everything in canvas space lives in #viewport, so panning is one
               transform and the coordinate math below never has to know -->
          <div id="viewport">
            <!-- aria-label is kept current per document in canvas.js's pushDoc(),
                 since this is the only accessible description of what the wasm
                 surface is drawing -->
            <canvas id="canvas" tabindex="0" role="img" aria-label="ImGui preview canvas"></canvas>
            <div id="selboxes"></div>
            <div id="selbox">
              <i class="rh rh-r" data-axis="w"></i>
              <i class="rh rh-b" data-axis="h"></i>
              <i class="rh rh-c" data-axis="wh"></i>
              <i class="rh rh-l winonly" data-axis="W"></i>
              <i class="rh rh-t winonly" data-axis="H"></i>
              <i class="rh rh-tl winonly" data-axis="WH"></i>
              <i class="rh rh-tr winonly" data-axis="Hw"></i>
              <i class="rh rh-bl winonly" data-axis="Wh"></i>
            </div>
            <div id="dropbox"></div>
            <div id="dropline"></div>
            <div id="hoverbox"></div>
            <div id="marquee"></div>
            <input id="inlineEdit" type="text" spellcheck="false">
          </div>
          <div id="guides"></div>
          <div id="coordtip"></div>
        </div>
        <canvas class="ruler" id="rulerRight"></canvas>
        <div class="rulercorner" id="cornerBL"></div>
        <canvas class="ruler" id="rulerBottom"></canvas>
        <div class="rulercorner" id="cornerBR"></div>
      </div>
      <div id="status">
        <span id="hoverInfo" aria-live="polite">—</span>
        <span class="spacer"></span>
        <span id="armInfo" aria-live="polite"></span>
        <span id="zoomctl">
          <button class="zbtn" id="zoomOutBtn" title="Zoom out ([)">&minus;</button>
          <button id="zoomPctBtn" title="Back to 100% (click), or fit the document (Ctrl+Shift+F)">100%</button>
          <button class="zbtn" id="zoomInBtn" title="Zoom in (])">+</button>
        </span>
      </div>
    </div>

    <div class="dockresize" id="resizeRight"></div>
    <div class="dock" id="dockRight">
      <section class="panel" data-panel="code" data-title="Generated C++">
        <div id="codehead">
          <select id="themeSel" title="Syntax highlighting theme"></select>
          <button id="editCodeBtn" title="Edit the C++ and apply it back to the document">Edit</button>
          <button id="applyCodeBtn" hidden>Apply</button>
          <button id="reloadCodeBtn" title="Regenerate from the current document, discarding edits here" hidden>Reload</button>
          <button id="cancelCodeBtn" hidden>Cancel</button>
          <button id="copyBtn">Copy</button>
        </div>
        <pre id="code"></pre>
        <div id="codeEditWrap" hidden>
          <pre id="codeEditHl"></pre>
          <textarea id="codeEdit" spellcheck="false"></textarea>
          <div id="codeCompl" hidden></div>
        </div>
        <div id="codeSig" hidden></div>
        <div id="codeLint" hidden></div>
        <div id="codeStatus" role="status" hidden></div>
      </section>
    </div>
    </div>
    <div class="dockresize horiz" id="resizeBottom"></div>
    <div class="dock" id="dockBottom"></div>
