<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conway's Game of Life</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0a0a1a;
    color: #e0e0e0;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
    user-select: none;
  }

  h1 {
    font-size: 1.8rem;
    margin-bottom: 6px;
    background: linear-gradient(135deg, #00d4ff, #7b2ff7);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 1px;
  }

  .subtitle {
    font-size: 0.8rem;
    color: #666;
    margin-bottom: 16px;
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    align-items: center;
    margin-bottom: 14px;
    padding: 12px 18px;
    background: #12122a;
    border-radius: 12px;
    border: 1px solid #1e1e3a;
  }

  button {
    padding: 8px 18px;
    border: 1px solid #2a2a5a;
    border-radius: 8px;
    background: #1a1a3a;
    color: #c8c8e8;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
    min-width: 72px;
  }

  button:hover { background: #2a2a5a; border-color: #4a4a8a; color: #fff; }
  button:active { transform: scale(0.96); }

  button.primary {
    background: linear-gradient(135deg, #1a3a6a, #2a2a7a);
    border-color: #3a5aaa;
    color: #a0d0ff;
  }
  button.primary:hover { background: linear-gradient(135deg, #2a4a8a, #3a3a9a); color: #fff; }

  button.danger {
    background: linear-gradient(135deg, #3a1a1a, #4a1a2a);
    border-color: #6a2a2a;
    color: #ff8a8a;
  }
  button.danger:hover { background: linear-gradient(135deg, #5a2a2a, #6a2a3a); color: #fff; }

  .speed-group {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-left: 8px;
  }

  .speed-group label {
    font-size: 0.8rem;
    color: #888;
    white-space: nowrap;
  }

  input[type="range"] {
    -webkit-appearance: none;
    width: 120px;
    height: 6px;
    border-radius: 3px;
    background: #1e1e3a;
    outline: none;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #5a5aff;
    cursor: pointer;
    border: 2px solid #8a8aff;
  }

  input[type="range"]::-moz-range-thumb {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #5a5aff;
    cursor: pointer;
    border: 2px solid #8a8aff;
  }

  .stats {
    display: flex;
    gap: 20px;
    font-size: 0.8rem;
    color: #777;
    margin-bottom: 10px;
  }

  .stats span { color: #aaa; font-weight: 600; }

  .canvas-wrapper {
    position: relative;
    border-radius: 10px;
    overflow: hidden;
    border: 2px solid #1e1e3a;
    box-shadow: 0 0 40px rgba(80, 80, 255, 0.08);
  }

  canvas {
    display: block;
    cursor: crosshair;
  }

  .keyboard-hint {
    margin-top: 14px;
    font-size: 0.72rem;
    color: #444;
    text-align: center;
    line-height: 1.6;
  }

  .keyboard-hint kbd {
    display: inline-block;
    padding: 1px 6px;
    background: #1a1a3a;
    border: 1px solid #2a2a5a;
    border-radius: 4px;
    font-family: monospace;
    font-size: 0.7rem;
    color: #888;
  }

  .presets {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: center;
    margin-bottom: 10px;
  }

  .presets button {
    padding: 5px 12px;
    font-size: 0.75rem;
    background: #14142e;
    border-color: #22224a;
  }
</style>

<body>

<h1>Conway's Game of Life</h1>
<p class="subtitle">B3 / S23 — Click to toggle cells · Arrow keys to navigate · Space to play/pause</p>

<div class="controls">
  <button class="primary" id="btnPlay" title="Space">▶ Start</button>
  <button id="btnStep" title="S">⏭ Step</button>
  <button class="danger" id="btnClear" title="C">✕ Clear</button>
  <div class="speed-group">
    <label for="speedSlider">Speed:</label>
    <input type="range" id="speedSlider" min="1" max="60" value="10">
    <label id="speedLabel">10 gen/s</label>
  </div>
</div>

<div class="presets">
  <button onclick="placePattern('glider')">Glider</button>
  <button onclick="placePattern('lwss')">LWSS</button>
  <button onclick="placePattern('pulsar')">Pulsar</button>
  <button onclick="placePattern('pentadecathlon')">Pentadecathlon</button>
  <button onclick="placePattern('gosperGun')">Gosper Gun</button>
  <button onclick="placePattern('random')">Random 30%</button>
</div>

<div class="stats">
  <div>Generation: <span id="genCount">0</span></div>
  <div>Population: <span id="popCount">0</span></div>
  <div>Grid: <span id="gridSize"></span></div>
</div>

<div class="canvas-wrapper">
  <canvas id="canvas"></canvas>
</div>

<div class="keyboard-hint">
  <kbd>Space</kbd> Play/Pause &nbsp; <kbd>S</kbd> Step &nbsp; <kbd>C</kbd> Clear &nbsp; <kbd>←↑→↓</kbd> Move cursor &nbsp; <kbd>Space</kbd>/<kbd>Enter</kbd> Toggle cell &nbsp; <kbd>R</kbd> Random fill &nbsp; <kbd>G</kbd> Glider &nbsp; <kbd>P</kbd> Pulsar
</div>

<script>
(function() {
  // --- Configuration ---
  const CELL_SIZE = 10;
  const GRID_W = 80;
  const GRID_H = 60;
  const CANVAS_W = GRID_W * CELL_SIZE;
  const CANVAS_H = GRID_H * CELL_SIZE;

  // --- State ---
  let grid = createGrid();
  let running = false;
  let generation = 0;
  let speed = 10;
  let animFrameId = null;
  let lastTickTime = 0;
  let cursorX = Math.floor(GRID_W / 2);
  let cursorY = Math.floor(GRID_H / 2);
  let isMouseDown = false;
  let mouseButton = 0;

  // --- DOM ---
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = CANVAS_W;
  canvas.height = CANVAS_H;

  const btnPlay = document.getElementById('btnPlay');
  const btnStep = document.getElementById('btnStep');
  const btnClear = document.getElementById('btnClear');
  const speedSlider = document.getElementById('speedSlider');
  const speedLabel = document.getElementById('speedLabel');
  const genCount = document.getElementById('genCount');
  const popCount = document.getElementById('popCount');
  const gridSizeEl = document.getElementById('gridSize');

  gridSizeEl.textContent = GRID_W + '×' + GRID_H;

  // --- Grid helpers ---
  function createGrid() {
    return Array.from({ length: GRID_H }, () => new Uint8Array(GRID_W));
  }

  function copyGrid(src) {
    return Array.from({ length: GRID_H }, (_, y) => new Uint8Array(GRID_W).map((_, x) => src[y][x]));
  }

  function countNeighbors(g, x, y) {
    let count = 0;
    for (let dy = -1; dy <= 1; dy++) {
      for (let dx = -1; dx <= 1; dx++) {
        if (dx === 0 && dy === 0) continue;
        const nx = (x + dx + GRID_W) % GRID_W;
        const ny = (y + dy + GRID_H) % GRID_H;
        count += g[ny][nx];
      }
    }
    return count;
  }

  function nextGeneration() {
    const next = createGrid();
    for (let y = 0; y < GRID_H; y++) {
      for (let x = 0; x < GRID_W; x++) {
        const n = countNeighbors(grid, x, y);
        if (grid[y][x]) {
          next[y][x] = (n === 2 || n === 3) ? 1 : 0;
        } else {
          next[y][x] = (n === 3) ? 1 : 0;
        }
      }
    }
    grid = next;
    generation++;
  }

  function countPopulation() {
    let count = 0;
    for (let y = 0; y < GRID_H; y++)
      for (let x = 0; x < GRID_W; x++)
        count += grid[y][x];
    return count;
  }

  // --- Rendering ---
  function render() {
    // Background
    ctx.fillStyle = '#08081a';
    ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

    // Grid lines
    ctx.strokeStyle = '#111128';
    ctx.lineWidth = 0.5;
    for (let x = 0; x <= GRID_W; x++) {
      ctx.beginPath();
      ctx.moveTo(x * CELL_SIZE, 0);
      ctx.lineTo(x * CELL_SIZE, CANVAS_H);
      ctx.stroke();
    }
    for (let y = 0; y <= GRID_H; y++) {
      ctx.beginPath();
      ctx.moveTo(0, y * CELL_SIZE);
      ctx.lineTo(CANVAS_W, y * CELL_SIZE);
      ctx.stroke();
    }

    // Cells
    for (let y = 0; y < GRID_H; y++) {
      for (let x = 0; x < GRID_W; x++) {
        if (grid[y][x]) {
          // Gradient based on neighbor count for visual flair
          const n = countNeighbors(grid, x, y);
          if (n <= 1) {
            ctx.fillStyle = '#ff4466'; // underpopulation red
          } else if (n === 2 || n === 3) {
            ctx.fillStyle = '#00d4ff'; // healthy cyan
          } else {
            ctx.fillStyle = '#ff8844'; // overpopulation orange
          }
          ctx.fillRect(x * CELL_SIZE + 1, y * CELL_SIZE + 1, CELL_SIZE - 2, CELL_SIZE - 2);
        }
      }
    }

    // Cursor highlight
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
    ctx.lineWidth = 2;
    ctx.strokeRect(cursorX * CELL_SIZE + 1, cursorY * CELL_SIZE + 1, CELL_SIZE - 2, CELL_SIZE - 2);

    // Update stats
    genCount.textContent = generation;
    popCount.textContent = countPopulation();
  }

  // --- Game loop ---
  function gameLoop(timestamp) {
    if (!running) return;
    const interval = 1000 / speed;
    if (timestamp - lastTickTime >= interval) {
      nextGeneration();
      lastTickTime = timestamp;
      render();
    }
    animFrameId = requestAnimationFrame(gameLoop);
  }

  function startGame() {
    if (running) return;
    running = true;
    btnPlay.textContent = '⏸ Pause';
    btnPlay.classList.remove('primary');
    lastTickTime = performance.now();
    animFrameId = requestAnimationFrame(gameLoop);
  }

  function pauseGame() {
    if (!running) return;
    running = false;
    btnPlay.textContent = '▶ Start';
    btnPlay.classList.add('primary');
    if (animFrameId) cancelAnimationFrame(animFrameId);
  }

  function togglePlay() {
    running ? pauseGame() : startGame();
  }

  function stepGame() {
    if (running) pauseGame();
    nextGeneration();
    render();
  }

  function clearGrid() {
    if (running) pauseGame();
    grid = createGrid();
    generation = 0;
    render();
  }

  function randomize(fraction) {
    if (running) pauseGame();
    grid = createGrid();
    for (let y = 0; y < GRID_H; y++)
      for (let x = 0; x < GRID_W; x++)
        grid[y][x] = Math.random() < (fraction || 0.3) ? 1 : 0;
    generation = 0;
    render();
  }

  // --- Patterns ---
  const patterns = {
    glider: [[0,1],[1,2],[2,0],[2,1],[2,2]],
    lwss: [[0,1],[0,4],[1,0],[2,0],[2,4],[3,0],[3,1],[3,2],[3,3]],
    pulsar: (function() {
      const p = [];
      const offsets = [
        [2,0],[3,0],[4,0],[8,0],[9,0],[10,0],
        [0,2],[5,2],[7,2],[12,2],
        [0,3],[5,3],[7,3],[12,3],
        [0,4],[5,4],[7,4],[12,4],
        [2,5],[3,5],[4,5],[8,5],[9,5],[10,5],
        [2,7],[3,7],[4,7],[8,7],[9,7],[10,7],
        [0,8],[5,8],[7,8],[12,8],
        [0,9],[5,9],[7,9],[12,9],
        [0,10],[5,10],[7,10],[12,10],
        [2,12],[3,12],[4,12],[8,12],[9,12],[10,12]
      ];
      return offsets;
    })(),
    pentadecathlon: [[0,0],[1,0],[2,-1],[2,1],[3,0],[4,0],[5,0],[6,0],[7,-1],[7,1],[8,0],[9,0]],
    gosperGun: [
      [0,4],[0,5],[1,4],[1,5],
      [10,3],[10,4],[10,5],[11,2],[11,6],[12,1],[12,7],[13,1],[13,7],
      [14,4],[15,2],[15,6],[16,3],[16,4],[16,5],[17,4],
      [20,1],[20,2],[20,3],[21,1],[21,2],[21,3],[22,0],[22,4],[24,-1],[24,0],[24,4],[24,5],
      [34,1],[34,2],[35,1],[35,2]
    ]
  };

  function placePattern(name) {
    if (running) pauseGame();
    const p = patterns[name];
    if (!p) return;
    grid = createGrid();
    const ox = Math.floor(GRID_W / 2) - 5;
    const oy = Math.floor(GRID_H / 2) - 5;
    p.forEach(([dx, dy]) => {
      const nx = (ox + dx + GRID_W) % GRID_W;
      const ny = (oy + dy + GRID_H) % GRID_H;
      grid[ny][nx] = 1;
    });
    generation = 0;
    render();
  }

  // --- Mouse interaction ---
  function getCellFromMouse(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = CANVAS_W / rect.width;
    const scaleY = CANVAS_H / rect.height;
    const mx = Math.floor((e.clientX - rect.left) * scaleX / CELL_SIZE);
    const my = Math.floor((e.clientY - rect.top) * scaleY / CELL_SIZE);
    if (mx >= 0 && mx < GRID_W && my >= 0 && my < GRID_H) return { x: mx, y: my };
    return null;
  }

  function toggleCell(x, y) {
    grid[y][x] = grid[y][x] ? 0 : 1;
    render();
  }

  function paintCell(x, y, value) {
    grid[y][x] = value;
    render();
  }

  canvas.addEventListener('mousedown', (e) => {
    e.preventDefault();
    isMouseDown = true;
    mouseButton = e.button;
    const cell = getCellFromMouse(e);
    if (!cell) return;
    cursorX = cell.x;
    cursorY = cell.y;
    if (mouseButton === 2 || mouseButton === 1) {
      paintCell(cell.x, cell.y, 1);
    } else {
      paintCell(cell.x, cell.y, grid[cell.y][cell.x] ? 0 : 1);
    }
  });

  canvas.addEventListener('mousemove', (e) => {
    const cell = getCellFromMouse(e);
    if (!cell) return;
    cursorX = cell.x;
    cursorY = cell.y;
    if (isMouseDown) {
      if (mouseButton === 2 || mouseButton === 1) {
        paintCell(cell.x, cell.y, 1);
      } else {
        paintCell(cell.x, cell.y, grid[cell.y][cell.x] ? 0 : 1);
      }
    } else {
      render(); // just update cursor
    }
  });

  canvas.addEventListener('mouseup', () => { isMouseDown = false; });
  canvas.addEventListener('mouseleave', () => { isMouseDown = false; });
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  // Touch support
  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const touch = e.touches[0];
    const cell = getCellFromMouse(touch);
    if (cell) {
      cursorX = cell.x;
      cursorY = cell.y;
      toggleCell(cell.x, cell.y);
    }
  }, { passive: false });

  canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    const touch = e.touches[0];
    const cell = getCellFromMouse(touch);
    if (cell) {
      cursorX = cell.x;
      cursorY = cell.y;
      paintCell(cell.x, cell.y, 1);
    }
  }, { passive: false });

  // --- Keyboard ---
  document.addEventListener('keydown', (e) => {
    const key = e.key.toLowerCase();

    if (e.target.tagName === 'INPUT') return;

    switch (key) {
      case ' ':
        e.preventDefault();
        togglePlay();
        break;
      case 's':
        e.preventDefault();
        stepGame();
        break;
      case 'c':
        e.preventDefault();
        clearGrid();
        break;
      case 'r':
        e.preventDefault();
        randomize(0.3);
        break;
      case 'g':
        e.preventDefault();
        placePattern('glider');
        break;
      case 'p':
        e.preventDefault();
        placePattern('pulsar');
        break;
      case 'enter':
        e.preventDefault();
        toggleCell(cursorX, cursorY);
        break;
      case 'arrowup':
        e.preventDefault();
        cursorY = (cursorY - 1 + GRID_H) % GRID_H;
        render();
        break;
      case 'arrowdown':
        e.preventDefault();
        cursorY = (cursorY + 1) % GRID_H;
        render();
        break;
      case 'arrowleft':
        e.preventDefault();
        cursorX = (cursorX - 1 + GRID_W) % GRID_W;
        render();
        break;
      case 'arrowright':
        e.preventDefault();
        cursorX = (cursorX + 1) % GRID_W;
        render();
        break;
    }
  });

  // --- Button events ---
  btnPlay.addEventListener('click', togglePlay);
  btnStep.addEventListener('click', stepGame);
  btnClear.addEventListener('click', clearGrid);

  speedSlider.addEventListener('input', () => {
    speed = parseInt(speedSlider.value);
    speedLabel.textContent = speed + ' gen/s';
  });

  // --- Init ---
  render();
})();
</script>
</body>
</html>
