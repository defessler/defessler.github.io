<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="beam-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7a5a1a" />
      <stop offset="55%" stop-color="#e6a528" />
      <stop offset="100%" stop-color="#fbead0" />
    </linearGradient>
    <marker id="beam-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a9b4bf" />
    </marker>
  </defs>

  <text x="490" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#eef2f6">Ownership beam anatomy (v0.7 Leaf G1)</text>
  <text x="490" y="45" text-anchor="middle" font-size="12" fill="#a9b4bf">Flow always runs selected -&gt; unselected (2026-07-13). Terminus clips to the UNSELECTED actor's visible edge, never its center.</text>

  <!-- Source actor -->
  <circle cx="140" cy="230" r="10" fill="#8fb8c9" stroke="#eef2f6" stroke-width="1.2"/>
  <text x="140" y="200" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#eef2f6">Source</text>
  <text x="140" y="255" text-anchor="middle" font-size="10.5" fill="#a9b4bf" font-style="italic">selected actor's location</text>
  <text x="140" y="270" text-anchor="middle" font-size="10.5" fill="#a9b4bf" font-style="italic">+ BeamZLiftCm</text>
  <text x="140" y="300" text-anchor="middle" font-family="Consolas, 'Cascadia Code', monospace" font-size="10.5" fill="#eef2f6">dim = BaseColor * BeamMinBrightness</text>

  <!-- Beam gradient line -->
  <rect x="160" y="222" width="560" height="16" rx="8" fill="url(#beam-grad)"/>

  <!-- Pulse packet -->
  <rect x="430" y="216" width="46" height="28" rx="6" fill="#ffffff" fill-opacity="0.55"/>
  <text x="453" y="200" text-anchor="middle" font-size="10.5" fill="#eef2f6">pulse packet</text>
  <text x="453" y="270" text-anchor="middle" font-size="10" fill="#a9b4bf" font-style="italic">BeamPulsePacketSegmentSpan segments,</text>
  <text x="453" y="284" text-anchor="middle" font-size="10" fill="#a9b4bf" font-style="italic">additive white boost, travels source-&gt;target</text>
  <text x="453" y="298" text-anchor="middle" font-size="10" fill="#a9b4bf" font-style="italic">once per CyclePhase (same clock as the thickness pulse)</text>
  <path d="M453,320 L520,320" fill="none" stroke="#eef2f6" stroke-width="1.4" marker-end="url(#beam-arrow)"/>

  <!-- Target actor mesh bounds -->
  <rect x="730" y="170" width="120" height="120" rx="8" fill="#28aad0" fill-opacity="0.10" stroke="#28aad0" stroke-width="1.6" stroke-dasharray="5 3"/>
  <text x="790" y="160" text-anchor="middle" font-size="11" fill="#a9b4bf" font-style="italic">target actor mesh / collision bounds</text>

  <!-- Clip point -->
  <circle cx="726" cy="230" r="6" fill="#fbead0" stroke="#eef2f6" stroke-width="1.2"/>
  <text x="726" y="200" text-anchor="middle" font-size="10.5" fill="#a9b4bf" font-style="italic">ActorLineTraceSingle hit,</text>
  <text x="726" y="185" text-anchor="middle" font-size="10.5" fill="#a9b4bf" font-style="italic">else GetComponentsBoundingBox +</text>
  <text x="726" y="170" text-anchor="middle" font-size="10.5" fill="#a9b4bf" font-style="italic">FMath::LineExtentBoxIntersection</text>

  <!-- Splash rings -->
  <circle cx="726" cy="230" r="24" fill="none" stroke="#fbead0" stroke-width="2" stroke-opacity="0.75"/>
  <circle cx="726" cy="230" r="42" fill="none" stroke="#fbead0" stroke-width="2" stroke-opacity="0.45"/>
  <circle cx="726" cy="230" r="60" fill="none" stroke="#fbead0" stroke-width="2" stroke-opacity="0.2"/>
  <text x="726" y="320" text-anchor="middle" font-size="11" font-weight="bold" fill="#eef2f6">Terminus splash</text>
  <text x="726" y="337" text-anchor="middle" font-size="10.5" fill="#a9b4bf" font-style="italic">BeamSplashRingCount concentric rings,</text>
  <text x="726" y="352" text-anchor="middle" font-size="10.5" fill="#a9b4bf" font-style="italic">phase-offset, radius 0 -&gt; BeamSplashMaxRadiusCm,</text>
  <text x="726" y="367" text-anchor="middle" font-size="10.5" fill="#a9b4bf" font-style="italic">fading out as they expand; axes perpendicular to the beam</text>

  <text x="726" y="255" text-anchor="middle" font-family="Consolas, 'Cascadia Code', monospace" font-size="10.5" fill="#eef2f6">head = Lerp(BaseColor, White, BeamHeadWhiteMix)</text>

  <!-- Direction examples -->
  <rect x="60" y="400" width="380" height="110" rx="10" fill="#63c78a" fill-opacity="0.08" stroke="#63c78a" stroke-width="1.6"/>
  <text x="250" y="424" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#eef2f6">Outpost selected</text>
  <text x="250" y="444" text-anchor="middle" font-family="Consolas, 'Cascadia Code', monospace" font-size="11" fill="#eef2f6">one beam per owned plot</text>
  <text x="250" y="462" text-anchor="middle" font-size="11" fill="#eef2f6">Outpost (selected) --&gt; Plot (unselected)</text>
  <text x="250" y="482" text-anchor="middle" font-size="10.5" fill="#a9b4bf" font-style="italic">TMultiMap&lt;definition id, plots&gt; built once per Render call</text>
  <text x="250" y="497" text-anchor="middle" font-size="10.5" fill="#a9b4bf" font-style="italic">(single TActorIterator&lt;AOutpostPlot&gt; pass, not one per outpost)</text>

  <rect x="540" y="400" width="380" height="110" rx="10" fill="#e6a528" fill-opacity="0.08" stroke="#e6a528" stroke-width="1.6"/>
  <text x="730" y="424" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#eef2f6">Plot selected</text>
  <text x="730" y="444" text-anchor="middle" font-family="Consolas, 'Cascadia Code', monospace" font-size="11" fill="#eef2f6">exactly one beam</text>
  <text x="730" y="462" text-anchor="middle" font-size="11" fill="#eef2f6">Plot (selected) --&gt; Outpost (unselected)</text>
  <text x="730" y="482" text-anchor="middle" font-size="10.5" fill="#a9b4bf" font-style="italic">skipped when that outpost is ALSO selected -</text>
  <text x="730" y="497" text-anchor="middle" font-size="10.5" fill="#a9b4bf" font-style="italic">the outpost-selected pass above already drew it</text>

  <text x="490" y="545" text-anchor="middle" font-size="11" fill="#a9b4bf">BaseColor = BeamVibrantPalette[GetTypeHash(PlotId) % palette size] - deterministic per plot, never derived from faction (v1.20 W-L). Empty palette or null outpost falls back to PlotGhostColor.</text>
</svg>
