<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8fb8e0" />
    </marker>
  </defs>

  <!-- Row 1 (reads left to right): Place Outpost -> + New Plot -> Assign Buildings -->
  <rect x="20" y="20" width="180" height="64" rx="8" fill="none" stroke="#8fb8e0" stroke-width="1.5" />
  <text x="110" y="47" fill="#e6edf5" font-size="14" text-anchor="middle">Place Outpost</text>
  <text x="110" y="66" fill="#9fb3c8" font-size="12" text-anchor="middle">click to drop marker</text>

  <line x1="200" y1="52" x2="256" y2="52" stroke="#8fb8e0" stroke-width="1.5" marker-end="url(#arrow)" />

  <rect x="260" y="20" width="180" height="64" rx="8" fill="none" stroke="#8fb8e0" stroke-width="1.5" />
  <text x="350" y="47" fill="#e6edf5" font-size="14" text-anchor="middle">+ New Plot</text>
  <text x="350" y="66" fill="#9fb3c8" font-size="12" text-anchor="middle">ring footprints, red if overlapping</text>

  <line x1="440" y1="52" x2="496" y2="52" stroke="#8fb8e0" stroke-width="1.5" marker-end="url(#arrow)" />

  <rect x="500" y="20" width="200" height="64" rx="8" fill="none" stroke="#8fb8e0" stroke-width="1.5" />
  <text x="600" y="47" fill="#e6edf5" font-size="14" text-anchor="middle">Assign Buildings</text>
  <text x="600" y="66" fill="#9fb3c8" font-size="12" text-anchor="middle">palette hot slot / eyedropper</text>

  <!-- drop down from Assign Buildings to row 2 -->
  <line x1="600" y1="84" x2="600" y2="186" stroke="#8fb8e0" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Row 2 (reads right to left): Gate by Faction -> Frame Overhead Camera -> Save and Stamp Prefab -->
  <rect x="500" y="190" width="200" height="64" rx="8" fill="none" stroke="#8fb8e0" stroke-width="1.5" />
  <text x="600" y="217" fill="#e6edf5" font-size="14" text-anchor="middle">Gate by Faction</text>
  <text x="600" y="236" fill="#9fb3c8" font-size="12" text-anchor="middle">restricts which buildings fit</text>

  <line x1="500" y1="222" x2="444" y2="222" stroke="#8fb8e0" stroke-width="1.5" marker-end="url(#arrow)" />

  <rect x="260" y="190" width="180" height="64" rx="8" fill="none" stroke="#8fb8e0" stroke-width="1.5" />
  <text x="350" y="217" fill="#e6edf5" font-size="14" text-anchor="middle">Frame Overhead Camera</text>
  <text x="350" y="236" fill="#9fb3c8" font-size="12" text-anchor="middle">pilot viewport, save framing</text>

  <line x1="260" y1="222" x2="204" y2="222" stroke="#8fb8e0" stroke-width="1.5" marker-end="url(#arrow)" />

  <rect x="20" y="190" width="180" height="64" rx="8" fill="none" stroke="#8fb8e0" stroke-width="1.5" />
  <text x="110" y="217" fill="#e6edf5" font-size="14" text-anchor="middle">Save &amp; Stamp Prefab</text>
  <text x="110" y="236" fill="#9fb3c8" font-size="12" text-anchor="middle">fork definition, drag into level</text>

  <!-- loop back up to Place Outpost -->
  <line x1="110" y1="190" x2="110" y2="88" stroke="#8fb8e0" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)" />
  <text x="125" y="142" fill="#7d93a8" font-size="12">loops: a stamp seeds a fresh outpost</text>
</svg>
