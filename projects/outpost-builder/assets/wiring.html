<title>OutpostBuilder — System Wiring</title>
<style>
  :root {
    --bg: #1e1e1e; --panel: #2d2d2d; --ink: #F8F8F2; --muted: #75715E;
    --line: #49483E; --chipbg: #141414; --dim: 0.14;
    --c1: #A6E22E; --c2: #66D9EF; --c3: #FD971F; --c4: #AE81FF; --c5: #E6DB74;
    --broken: #F92672;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1e1e1e; --panel: #2d2d2d; --ink: #F8F8F2; --muted: #75715E;
      --line: #49483E; --chipbg: #141414;
      --c1: #A6E22E; --c2: #66D9EF; --c3: #FD971F; --c4: #AE81FF; --c5: #E6DB74;
      --broken: #F92672;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1e1e1e; --panel: #2d2d2d; --ink: #F8F8F2; --muted: #75715E;
    --line: #49483E; --chipbg: #141414;
    --c1: #A6E22E; --c2: #66D9EF; --c3: #FD971F; --c4: #AE81FF; --c5: #E6DB74;
    --broken: #F92672;
  }
  :root[data-theme="light"] {
    --bg: #1e1e1e; --panel: #2d2d2d; --ink: #F8F8F2; --muted: #75715E;
    --line: #49483E; --chipbg: #141414;
    --c1: #A6E22E; --c2: #66D9EF; --c3: #FD971F; --c4: #AE81FF; --c5: #E6DB74;
    --broken: #F92672;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Segoe UI", system-ui, sans-serif; font-size: 15px; line-height: 1.45;
  }
  .wrap { max-width: 1520px; margin: 0 auto; padding: 20px 24px 48px; }

  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 18px; margin-bottom: 6px; }
  h1 { font-family: "Bahnschrift", "Arial Narrow", "Segoe UI", sans-serif; font-weight: 600; font-size: 26px; letter-spacing: 0.02em; margin: 0; }
  h1 .mono { font-family: "Cascadia Code", Consolas, monospace; font-size: 22px; color: var(--c2); }
  .sub { color: var(--muted); font-size: 14px; }

  .legend { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 14px; }
  .chip {
    display: inline-flex; align-items: center; gap: 7px;
    font-family: "Bahnschrift", "Arial Narrow", sans-serif; font-size: 12.5px;
    letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted);
    background: var(--chipbg); border-radius: 3px; padding: 4px 10px;
  }
  .chip i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 14px; }
  .tab {
    font-family: "Bahnschrift", "Arial Narrow", sans-serif; font-size: 13.5px; letter-spacing: 0.05em;
    padding: 7px 14px; border: 1px solid var(--line); border-radius: 3px;
    background: var(--panel); color: var(--ink); cursor: pointer;
  }
  .tab:hover { border-color: var(--muted); }
  .tab:focus-visible { outline: 2px solid var(--c2); outline-offset: 1px; }
  .tab[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

  .stage { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; overflow-x: auto; padding: 6px 2px; }
  svg { display: block; min-width: 1100px; width: 100%; height: auto; }

  .node rect { fill: var(--bg); stroke-width: 1.4; cursor: pointer; }
  .node text { pointer-events: none; }
  .node .t { font-family: "Bahnschrift", "Arial Narrow", sans-serif; font-size: 14.5px; font-weight: 600; fill: var(--ink); }
  .node .s { font-family: "Cascadia Code", Consolas, monospace; font-size: 10.5px; fill: var(--muted); }
  .node:focus { outline: none; }
  .node:focus rect, .node:hover rect { stroke-width: 2.4; }
  .node.selected rect { stroke-width: 2.6; }

  .colhead { font-family: "Bahnschrift", "Arial Narrow", sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.14em; }
  .colsub { font-family: "Cascadia Code", Consolas, monospace; font-size: 10px; fill: var(--muted); }
  .container-box { fill: none; stroke: var(--line); stroke-dasharray: 5 4; }
  .container-label { font-family: "Cascadia Code", Consolas, monospace; font-size: 11px; fill: var(--muted); }

  .edge { fill: none; stroke-width: 1.7; }
  .edge.ret { stroke-dasharray: 5 4; }
  .edge.broken { stroke-dasharray: 3 4; stroke-width: 2.1; }
  .elbl {
    font-family: "Cascadia Code", Consolas, monospace; font-size: 10.5px; fill: var(--muted);
    paint-order: stroke; stroke: var(--panel); stroke-width: 3px;
  }
  .badge { font-family: "Bahnschrift", "Arial Narrow", sans-serif; font-size: 10px; letter-spacing: 0.08em; }

  .dimmed { opacity: var(--dim); }
  @media (prefers-reduced-motion: no-preference) {
    .edge, .node rect, .node text, .elbl { transition: opacity 0.25s ease, stroke-width 0.15s ease; }
  }

  .info { display: grid; grid-template-columns: 3fr 2fr; gap: 14px; margin-top: 14px; }
  @media (max-width: 900px) { .info { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 14px 18px; }
  .card h2 {
    font-family: "Bahnschrift", "Arial Narrow", sans-serif; font-size: 13px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--muted); margin: 0 0 8px; font-weight: 600;
  }
  .card p { margin: 0 0 8px; max-width: 70ch; }
  .card p:last-child { margin-bottom: 0; }
  .card code { font-family: "Cascadia Code", Consolas, monospace; font-size: 13px; color: var(--c2); }
  #inspect .hint { color: var(--muted); font-style: italic; }
  #inspect h3 { font-family: "Bahnschrift", "Arial Narrow", sans-serif; font-size: 16px; margin: 0 0 6px; }

  footer { margin-top: 16px; color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 6px 22px; }
  footer b { color: var(--ink); font-weight: 600; }
  .ok { color: var(--c1); font-weight: 600; }
  .bad { color: var(--broken); font-weight: 600; }
</style>

<style>
  /* OutpostBuilder docs Monokai palette - committed dark, matches assets/css/style.css.
     Overrides the renderer's default tokens; later source order + matched specificity win. */
  :root, :root[data-theme="dark"], :root[data-theme="light"] {
    color-scheme: dark;
    --bg: #1e1e1e;                       /* Monokai bg - node fill + page ground */
    --panel: #2d2d2d;                    /* Monokai surface - stage/cards/label halo */
    --ink: #F8F8F2;
    --muted: #75715E;
    --line: #49483E;
    --chipbg: #141414;
    --dim: 0.12;
    --c1: #A6E22E;   /* green   - world actors */
    --c2: #66D9EF;   /* cyan    - editor tool (lead accent) */
    --c3: #FD971F;   /* orange  - reserved warn */
    --c4: #AE81FF;   /* purple  - data model */
    --c5: #E6DB74;   /* yellow  - runtime */
    --broken: #F92672;
  }
  body {
    background:
      radial-gradient(1100px 620px at 82% -8%, rgba(102,217,239,.06), transparent 60%),
      radial-gradient(900px 560px at 12% 108%, rgba(174,129,255,.06), transparent 60%),
      var(--bg);
    background-attachment: fixed;
  }
  .stage { box-shadow: inset 0 0 0 1px rgba(73,72,62,.06); }
</style>

<script>
(function () {
   const SPEC = {"title":"OutpostBuilder","titleSuffix":"System Wiring","subtitle":"an editor mode that authors outposts as data - every edit writes through flat actors into one definition asset, and both modules resolve everything through FPrimaryAssetId, never a held pointer","columns":[{"title":"EDITOR TOOL","sub":"OutpostBuilderEditor module","legend":"Editor tool (never cooked)","slot":2},{"title":"DATA MODEL","sub":"definition + settings assets","legend":"Data assets","slot":4},{"title":"WORLD ACTORS","sub":"OutpostBuilder/Actors","legend":"Flat world actors","slot":1},{"title":"RUNTIME","sub":"OutpostBuilder module - ships cooked","legend":"Runtime (packaged games)","slot":5}],"nodes":[{"id":"edmod","col":0,"title":"FOutpostBuilderEditorModule","sub":"StartupModule - commands, watchers, menus","desc":"The editor module entry point. Registers FOutpostBuilderCommands (the ed mode itself needs none - it's a UEdMode, discovered from its own CDO), watches OnObjectPropertyChanged (a building-definition edit live-refreshes every loaded plot's mesh; a settings edit re-scans the definition folder and refreshes the toolkit) and OnAssetRenamed (rebinds placed actors), and hangs Locate/Restore off the definition asset's Content Browser menu. None of it exists in a cooked build."},{"id":"edmode","col":0,"title":"UOutpostBuilderEdMode","sub":"the placement / editing state machine","desc":"A UEdMode (UBaseLegacyWidgetEdMode, so it keeps the legacy Render/DrawHUD/InputKey surface). Owns outpost + plot placement, the editing submode, and overhead-camera positioning. EnterOutpostEditMode gets-or-creates the outpost's UOutpostDefinition; an action like AssignBuildingToSelectedPlot writes through both the AOutpostPlot actor and its record in one transaction. It never holds its own copy of outpost state - always the same FPrimaryAssetId lookups and record-basis math."},{"id":"toolkit","col":0,"title":"FOutpostBuilderToolkit","sub":"Overview + Editing panels","desc":"An FModeToolkit and undo client, one .cpp per panel. Overview is two tabs (an asset-registry-driven Outposts list plus a Buildings browser, so bases in maps that aren't even open still list); Editing is one tab-less body (identity header, Select Plot Contents palette, Plots section). The camera/volume verbs and Save live on the in-viewport editing bar, not a panel section."},{"id":"widgets","col":0,"title":"FOutpostBuilderWidgetContext","sub":"the widgets' read-model","desc":"A ref-counted, find-only read-model injected into the extracted SOutpost* widgets. Widgets never hold the mode - they pull bound attributes (editing outpost, selected plot, placement flags, building eligibility) through this context; writes travel back the other way through toolkit forwarders into mode methods."},{"id":"palette","col":0,"title":"FOutpostPaletteModel","sub":"+ SOutpostBuildingPalette / tiles / grid","desc":"The one shared source of palette truth: scanned building entries, the hot building, the pinned-first visible subset, the thumbnail cache. The panel palette, the in-viewport command grid, the category-tab and filter rows, and the assign row are all observers of this single model - no surface re-derives the list."},{"id":"draw","col":0,"title":"OutpostBuilder::Draw","sub":"all viewport ink","desc":"Free draw / DrawHUD functions taking explicit parameters, never the mode's this: ghost plates and prisms, selection markers, outpost labels, ownership beams (each plot a deterministic per-user color, keyed by plot id, never by faction). Every color/size/timing value is a UOutpostBuilderUserSettings knob in Editor Preferences, so a designer retunes with no recompile. The geometry itself is one layer further down, in OutpostDrawPrimitives - segments, rings, pulsed beams, screen text, with zero Outpost types - so this file just gathers Outpost state and hands it off."},{"id":"prefab","col":0,"title":"OutpostPrefabUtils","sub":"ForkDefinition · StampPrefab · SpawnDefaultOutpostVolume","desc":"The fork-on-stamp helpers. ForkDefinition mints a fresh UOutpostDefinition so each stamped base owns its own copy of the layout; StampPrefab drives the drag-drop stamp; SpawnDefaultOutpostVolume seeds the Outpost Volume around a new base (idempotent - never a second volume on one definition); FindBlockingExclusionVolume enforces the spacing rule."},{"id":"factory","col":0,"title":"UActorFactoryOutpostPrefab","sub":"drag a definition into the level","desc":"The Content Browser actor factory. Drop a UOutpostDefinition into a viewport and the engine's own placement path forks-and-stamps a whole base through it - GetDefaultActorClass resolves the configured outpost class ahead of the engine's PostSpawnActor. The interactive twin of the code-callable StampOutpost."},{"id":"def","col":1,"title":"UOutpostDefinition","sub":"the single source of truth","desc":"A UPrimaryDataAsset: display name, Faction (EOutpostFaction, the persistent owner), the plot records (FOutpostPlotRecord - id, relative transform, size tag, assigned building), the saved OverheadCamera record plus a per-plot PlotCameras map keyed by PlotId, and a soft path + world transform back to the placed AOutpost. Every reference in the plugin is an FPrimaryAssetId (or an FGuid within one outpost), resolved on demand, never a raw pointer held across a save."},{"id":"bdef","col":1,"title":"UOutpostBuildingDefinition","sub":"what a building is","desc":"BuildingMesh (what a plot renders in game worlds) and the palette thumbnail; BuildingActorClass (the editor preview, and a project's own gameplay spawns); the two placement rules - the PlotSizeQuery it fits (empty fits every plot) and the SupportedFactions that field it; and a BuildingCategory tag that only groups the palette. Plot size is the one size concept - its centimetres live on the settings asset, not here."},{"id":"settings","col":1,"title":"UOutpostBuilderSettingsAsset","sub":"the one project settings asset","desc":"A scanned UPrimaryDataAsset (type \"OutpostBuilderSettings\"): the actor class overrides, the created-definition folder, per-tag plot-size dimensions, exclusion distance, and the EmptyPlotMesh / DefaultPreviewMesh soft refs. AlwaysCook plus a one-shot PreWarm make those meshes resolve from the first frame of a packaged game."},{"id":"rsettings","col":1,"title":"UOutpostRuntimeSettings","sub":"config - points at the settings asset","desc":"The UDeveloperSettings Project Settings page. Holds the SettingsAsset soft pointer and resolves the four actor classes (GetOutpostClass / GetPlotClass / GetVolumeClass / GetOverheadCameraClass) through it, each with the plugin's native class as the never-null fallback - the one place every spawn site in both modules asks for a class."},{"id":"outpost","col":2,"title":"AOutpost","sub":"the anchor","desc":"Carries OutpostDefinitionId and its EOutpostFaction, plus an editor-only preview cube (factions have no mesh or color effect). GetRecordBasisTransform() returns the anchor's rotation and translation at unit scale, so scaling the actor never distorts stamped plots. Moving it fires ReRelativizeOwnedRecords - plots stay put, their stored records catch up. Never attached to anything: UChildActorComponent is banned plugin-wide."},{"id":"plot","col":2,"title":"AOutpostPlot","sub":"write-through sync + runtime mesh","desc":"One actor per plot record. PostEditMove and PostEditChangeChainProperty fire SyncRecordTransform straight into the owning definition's record - drag it in the viewport and the asset is already correct. Carries a RUNTIME BuildingMeshComponent, so a stamped base renders in packaged games for free; in editor worlds a class-based building is mirrored as transient preview parts instead."},{"id":"volume","col":2,"title":"AOutpostVolume","sub":"the Outpost Volume (exclusion fence)","desc":"An amber AVolume brush bound to the definition id, spawned automatically with every outpost. It blocks OTHER outposts from being placed or stamped within the configured exclusion distance of its extents - never its own definition - and cascades, and undo-restores, with its outpost's delete."},{"id":"camera","col":2,"title":"AOverheadCamera","sub":"zero-or-one saved view","desc":"Spawned unconditionally the moment editing an outpost starts (EnsureOverheadCameraForEditingOutpost), so it always exists while editing. Deliberately not an ACameraActor, whose constructor forces the letterbox. Exactly one per outpost - the per-plot framings are PlotCameras data on the definition, not additional camera actors."},{"id":"module","col":3,"title":"FOutpostBuilderModule","sub":"RegisterAssetScans - /Game + AlwaysCook","desc":"The runtime module. Scans /Game for the definition and settings primary-asset types and pairs each scan with an AlwaysCook rule in one call, because nothing here is reached by a package reference the cooker follows on its own - only by FPrimaryAssetId. Without AlwaysCook a packaged game silently drops them all. Deferred to PostEngineInit when the asset manager isn't up at module load."},{"id":"stamp","col":3,"title":"UOutpostStampLibrary","sub":"records → actors · fork-on-stamp","desc":"A BlueprintCallable library game code can call from a cooked build. StampOutpost forks a fresh definition per placement and spawns the outpost + plots + camera from records (the shared SpawnPlotsAndCameraFromDefinition helper); PlaceDefinitionAt is the non-forking \"Edit (Place Actor)\" counterpart that keeps one definition per outpost; RestoreOutpost (editor-only) re-attaches a deleted base at its recorded transform."},{"id":"events","col":3,"title":"UOutpostEventSubsystem","sub":"editor → runtime bridge","desc":"A UWorldSubsystem broadcasting the plugin's three runtime events - outpost stamped, plot assigned, faction changed - counting editor authoring too, and never on a failed spawn or an undo/redo. How gameplay code reacts without ever depending on the editor module."},{"id":"query","col":3,"title":"OutpostActorQuery.h","sub":"FindUniqueActorForDefinition<T>","desc":"The id-not-pointer spine, and what stands in for a manager subsystem. A templated family scan (FindUnique / FindFirst / ForEachFamilyActorOfDefinition) duck-typed on GetOutpostDefinitionId(), shared by plots, cameras, and the outposts themselves. Ambiguity fails closed - two outposts sharing an id return null, not an arbitrary pick - which is exactly what a record write-back checks before trusting itself as the owner."},{"id":"actoredit","col":3,"title":"OutpostBuilder::ActorEditing","sub":"OutpostActorEditingLibrary.h - WITH_EDITOR only","desc":"AOutpost/AOutpostPlot's editor-only logic (record sync, cascade delete, import-identity handling, the mirrored-building preview) as free functions taking the actor as their first parameter, reached through a one-line forward from each editor lifecycle hook (PostEditMove, Destroyed, PostEditImport, and the rest). Lives in the runtime module because those hooks are UObject virtual overrides that can't move out of the actor classes, and the runtime module can't link the editor module to host them elsewhere. Wrapped whole in WITH_EDITOR, so despite its address it never reaches a cooked build."}],"edges":[{"from":"edmod","to":"edmode","label":"commands + CB actions"},{"from":"edmode","to":"toolkit","label":"creates · notifies"},{"from":"toolkit","to":"edmode","label":"Create / Place / Restore / actions"},{"from":"toolkit","to":"widgets","label":"builds context"},{"from":"widgets","to":"edmode","label":"bound getters","ret":true},{"from":"toolkit","to":"palette","label":"owns model"},{"from":"palette","to":"bdef","label":"scan · thumbnails · eligibility"},{"from":"edmode","to":"draw","label":"Render / DrawHUD"},{"from":"edmode","to":"prefab","label":"fork · stamp · volume seed"},{"from":"factory","to":"prefab","label":"drag-drop → StampPrefab"},{"from":"edmode","to":"def","label":"write-through records"},{"from":"edmode","to":"settings","label":"knobs · folders · caps","ret":true},{"from":"edmode","to":"outpost","label":"place · select · frame"},{"from":"edmode","to":"plot","label":"ghost → confirm → spawn"},{"from":"edmode","to":"camera","label":"positioning submode (O)"},{"from":"rsettings","to":"settings","label":"SettingsAsset ptr + class resolvers"},{"from":"outpost","to":"actoredit","label":"editor lifecycle-hook forwards"},{"from":"plot","to":"actoredit","label":"editor lifecycle-hook forwards"},{"from":"actoredit","to":"def","label":"ReRelativizeOwnedRecords · SyncRecordTransform · cascade delete"},{"from":"plot","to":"def","label":"AssignedBuildingId · write-through"},{"from":"plot","to":"bdef","label":"preview mirror","ret":true},{"from":"prefab","to":"volume","label":"SpawnDefaultOutpostVolume"},{"from":"prefab","to":"def","label":"ForkDefinition - new asset per stamp"},{"from":"prefab","to":"stamp","label":"StampPrefab → spawn family"},{"from":"def","to":"stamp","label":"plot / camera records","ret":true},{"from":"stamp","to":"outpost","label":"spawns the anchor"},{"from":"stamp","to":"plot","label":"spawns from records"},{"from":"stamp","to":"events","label":"NotifyOutpostStamped"},{"from":"module","to":"def","label":"scan + AlwaysCook"},{"from":"plot","to":"query","label":"FindOwningOutpostActor","ret":true}],"flows":[{"id":"over","title":"Overview","html":"<p>An editor mode that authors outposts <b>as data</b>. The left column is the tool, the second is the truth, the third is the world, the fourth is what ships in a packaged game. The load-bearing idea: a base is never an actor hierarchy - it is a record graph on one <code>UOutpostDefinition</code>, and the flat actors are just its rendering. Every relationship is an <code>FPrimaryAssetId</code> resolved on demand, never a held pointer, which is what lets any module find any base by scanning for a matching id.</p>"},{"id":"place","title":"Place an outpost","caption":"Place an outpost - a definition is born","html":"<p>Create (or Place, for an existing definition) on the Overview panel puts the mode into placement: ghost box, grid snap, exclusion blocking. Confirming spawns the <code>AOutpost</code>, auto-creates and binds a <code>UOutpostDefinition</code> when there wasn't one, records the placement, and seeds the base's default <code>AOutpostVolume</code>, the Outpost Volume that fences other outposts out - its size and folder read from the project settings asset.</p>","edges":["toolkit>edmode","edmode>outpost","edmode>def","edmode>prefab","prefab>volume","edmode>settings"],"nodes":["toolkit","edmode","outpost","def","prefab","volume","settings"]},{"id":"writethrough","title":"Write-through","caption":"Write-through - the asset is always right","html":"<p>Once a plot exists, the actor <b>is</b> the editing surface. Move it and <code>SyncRecordTransform</code> writes the definition's record in the same breath; move the anchor and <code>ReRelativizeOwnedRecords</code> recomputes every plot's record while the plots themselves stay put - both reached through one-line forwards into <code>OutpostBuilder::ActorEditing</code>, the free-function library backing the actors' editor-only hooks. Ownership is resolved by scanning for a matching id through <code>OutpostActorQuery</code>, never by walking an attachment chain - there is none.</p>","edges":["edmode>plot","plot>actoredit","outpost>actoredit","actoredit>def","edmode>draw","plot>query"],"nodes":["edmode","plot","outpost","actoredit","def","draw","query"]},{"id":"assign","title":"Assign buildings","caption":"Assign buildings - one palette model, every surface","html":"<p>The palette model scans <code>UOutpostBuildingDefinition</code> assets and holds the hot building; the panel palette, the in-viewport command grid, and the assign row are all views of it. Assigning writes <code>AssignedBuildingId</code> through the selected <code>AOutpostPlot</code> into its record, and the plot's preview mirror re-renders the building's real meshes at once. A building the outpost's faction can't field is simply left out of the palette.</p>","edges":["toolkit>palette","palette>bdef","edmode>plot","plot>def","plot>bdef"],"nodes":["toolkit","palette","bdef","edmode","plot","def"]},{"id":"fork","title":"Fork-on-stamp","caption":"Fork-on-stamp - one saved base, many independent copies","html":"<p>Drag a saved <code>UOutpostDefinition</code> from the Content Browser into the level and <code>UActorFactoryOutpostPrefab</code> runs the fork path: <code>ForkDefinition</code> mints a brand-new definition asset so the stamped base owns its own layout, then the stamp library spawns the outpost and its plots from records and the event subsystem fires. This is what separates <code>StampOutpost</code> (a new definition per placement) from <code>PlaceDefinitionAt</code>/<code>RestoreOutpost</code>, which keep one definition per outpost.</p>","edges":["factory>prefab","prefab>def","prefab>stamp","def>stamp","stamp>outpost","stamp>plot","stamp>events"],"nodes":["factory","prefab","def","stamp","outpost","plot","events"]},{"id":"cooked","title":"Runtime & cook","caption":"Runtime & cook - what survives into a packaged game","html":"<p>None of the editor module ships. What a cooked game gets is the runtime module: <code>FOutpostBuilderModule</code> scans /Game and force-cooks the definitions with <code>AlwaysCook</code> (nothing reaches them but an <code>FPrimaryAssetId</code>, so the cooker would otherwise drop them), <code>UOutpostStampLibrary</code> spawns bases from records on a code call, each <code>AOutpostPlot</code> renders its own building through a runtime mesh component, and <code>UOutpostEventSubsystem</code> tells gameplay a base appeared - all resolved through the same id lookups the editor wrote.</p>","edges":["module>def","def>stamp","stamp>outpost","stamp>plot","stamp>events","plot>query"],"nodes":["module","def","stamp","outpost","plot","events","query"]}],"footer":[{"label":"Engine","value":"UE 5.7 / 5.8","tone":"plain"},{"label":"Modules","value":"OutpostBuilder + OutpostBuilderEditor","tone":"plain"},{"label":"Actor model","value":"flat - records, not nesting (UChildActorComponent banned)","tone":"plain"},{"label":"Cook","value":"definitions AlwaysCook - runtime resolves the same ids","tone":"ok"}]};
  if (!SPEC) { document.body.textContent = "wiring spec missing"; return; }

  const NS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("d");
  const slotVar = s => s === "broken" ? "var(--broken)" : `var(--c${s})`;
  const el = (tag, attrs, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    (parent || svg).appendChild(e); return e;
  };
  const hel = (tag, cls, parent) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    parent.appendChild(e); return e;
  };

  // ---- header / legend / footer ----
  document.getElementById("ttl-main").textContent = SPEC.title;
  document.getElementById("ttl-suffix").textContent = SPEC.titleSuffix || "";
  document.getElementById("ttl-sub").textContent = SPEC.subtitle || "";
  document.title = SPEC.title + (SPEC.titleSuffix ? " — " + SPEC.titleSuffix : "");

  const legend = document.getElementById("legend");
  SPEC.columns.forEach(c => {
    const chip = hel("span", "chip", legend);
    const i = hel("i", "", chip); i.style.background = slotVar(c.slot);
    chip.appendChild(document.createTextNode(" " + c.legend));
  });
  (SPEC.legendExtra || []).forEach(x => {
    const chip = hel("span", "chip", legend);
    const i = hel("i", "", chip); i.style.background = slotVar(x.slot);
    chip.appendChild(document.createTextNode(" " + x.label));
  });

  const foot = document.getElementById("foot");
  (SPEC.footer || []).forEach(f => {
    const s = hel("span", "", foot);
    const b = hel("b", "", s); b.textContent = f.label + " ";
    const v = hel("span", f.tone === "ok" ? "ok" : f.tone === "bad" ? "bad" : "", s);
    v.textContent = f.value;
  });

  // ---- layout: columns of stacked nodes, groups boxed ----
  const COLW = 312, CGAP = 72, MX = 40, Y0 = 112, VGAP = 16, BASE_H = 56, BADGE_H = 18;
  const ncols = SPEC.columns.length;
  const W = MX * 2 + ncols * COLW + (ncols - 1) * CGAP;
  const colX = i => MX + i * (COLW + CGAP);

  const byId = {};
  const colStacks = SPEC.columns.map(() => []);
  SPEC.nodes.forEach(n => { byId[n.id] = n; colStacks[n.col].push(n); });

  const groupBoxes = [];
  let maxY = 0;
  colStacks.forEach((stack, ci) => {
    let y = Y0, curGroup = null, gStart = 0;
    stack.forEach((n, idx) => {
      const g = n.group || null;
      if (g !== curGroup) {
        if (curGroup) { groupBoxes.push({ col: ci, label: curGroup, y0: gStart, y1: y - VGAP + 8 }); y += 10; }
        if (g) { y += 30; gStart = y - 22; }
        curGroup = g;
      }
      n._x = colX(ci) + (g ? 14 : 0);
      n._w = COLW - (g ? 28 : 0);
      n._h = BASE_H + (n.badge ? BADGE_H : 0);
      n._y = y;
      y += n._h + VGAP;
    });
    if (curGroup) groupBoxes.push({ col: ci, label: curGroup, y0: gStart, y1: y - VGAP + 8 });
    maxY = Math.max(maxY, y);
  });
  const H = maxY + 28;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);

  // ---- defs: arrow markers ----
  const defs = el("defs", {});
  const usedSlots = new Set(SPEC.columns.map(c => String(c.slot))); usedSlots.add("broken");
  usedSlots.forEach(s => {
    const m = el("marker", { id: "m-" + s, viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: "auto-start-reverse" }, defs);
    el("path", { d: "M0,0 L10,5 L0,10 z", fill: slotVar(s) }, m);
  });

  // ---- column headers ----
  SPEC.columns.forEach((c, i) => {
    const x = colX(i);
    const t = el("text", { x, y: 60, class: "colhead", fill: slotVar(c.slot) }); t.textContent = c.title;
    const s = el("text", { x, y: 78, class: "colsub" }); s.textContent = c.sub || "";
    el("line", { x1: x, y1: 88, x2: x + COLW, y2: 88, stroke: slotVar(c.slot), "stroke-width": 2 });
  });

  // ---- group boxes ----
  groupBoxes.forEach(g => {
    el("rect", { x: colX(g.col) + 2, y: g.y0, width: COLW - 4, height: g.y1 - g.y0, rx: 6, class: "container-box" });
    const t = el("text", { x: colX(g.col) + 12, y: g.y0 + 16, class: "container-label" });
    t.textContent = g.label;
  });

  // ---- edges ----
  function anchor(a, b) {
    if (b._x >= a._x + a._w - 4) return { sx: a._x + a._w, sy: a._y + a._h / 2, tx: b._x, ty: b._y + b._h / 2 };
    if (b._x + b._w <= a._x + 4) return { sx: a._x, sy: a._y + a._h / 2, tx: b._x + b._w, ty: b._y + b._h / 2 };
    const acx = a._x + a._w / 2, bcx = b._x + b._w / 2;
    if (b._y > a._y) return { sx: acx - a._w / 4, sy: a._y + a._h, tx: bcx - b._w / 4, ty: b._y, vert: true };
    return { sx: acx - a._w / 4, sy: a._y, tx: bcx - b._w / 4, ty: b._y + b._h, vert: true };
  }
  const edgeEls = {}, lblEls = {};
  SPEC.edges.forEach(ed => {
    ed._key = ed.from + ">" + ed.to;
    const a = byId[ed.from], b = byId[ed.to];
    const { sx, sy, tx, ty, vert } = anchor(a, b);
    let d;
    if (vert) {
      d = `M ${sx} ${sy} C ${sx - 34} ${sy + (ty > sy ? 18 : -18)}, ${tx - 34} ${ty - (ty > sy ? 18 : -18)}, ${tx} ${ty}`;
    } else {
      const dx = Math.max(46, Math.min(120, Math.abs(tx - sx) / 2)) * (tx > sx ? 1 : -1);
      d = `M ${sx} ${sy} C ${sx + dx} ${sy}, ${tx - dx} ${ty}, ${tx} ${ty}`;
    }
    const slot = ed.broken ? "broken" : String(SPEC.columns[a.col].slot);
    const p = el("path", {
      d, class: "edge" + (ed.ret ? " ret" : "") + (ed.broken ? " broken" : ""),
      stroke: slotVar(slot), "marker-end": `url(#m-${slot})`
    });
    edgeEls[ed._key] = p;
    if (ed.label) {
      const t = el("text", { x: (sx + tx) / 2, y: (sy + ty) / 2 - 7, class: "elbl", "text-anchor": "middle" });
      t.textContent = ed.label;
      t.style.display = "none";
      lblEls[ed._key] = t;
    }
  });

  // ---- nodes ----
  const nodeEls = {};
  SPEC.nodes.forEach(n => {
    const slot = SPEC.columns[n.col].slot;
    const g = el("g", { class: "node", tabindex: 0, role: "button", "aria-label": n.title });
    el("rect", { x: n._x, y: n._y, width: n._w, height: n._h, rx: 5, stroke: slotVar(slot) }, g);
    const t1 = el("text", { x: n._x + 12, y: n._y + 24, class: "t" }, g); t1.textContent = n.title;
    const t2 = el("text", { x: n._x + 12, y: n._y + 42, class: "s" }, g); t2.textContent = n.sub || "";
    if (n.badge) {
      const bt = el("text", { x: n._x + 12, y: n._y + 62, class: "badge", fill: "var(--broken)" }, g);
      bt.textContent = n.badge;
    }
    nodeEls[n.id] = g;
    const select = () => {
      document.querySelectorAll(".node.selected").forEach(x => x.classList.remove("selected"));
      g.classList.add("selected");
      const box = document.getElementById("inspect");
      box.innerHTML = "<h2>Inspect</h2>";
      const h3 = document.createElement("h3"); h3.style.color = slotVar(slot); h3.textContent = n.title; box.appendChild(h3);
      const sub = document.createElement("p");
      sub.style.cssText = "font-family:'Cascadia Code',Consolas,monospace;font-size:12px;color:var(--muted);margin-bottom:8px";
      sub.textContent = n.sub || ""; box.appendChild(sub);
      const p = document.createElement("p"); p.textContent = n.desc || ""; box.appendChild(p);
    };
    g.addEventListener("click", select);
    g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(); } });
  });

  // ---- flows ----
  const tabs = document.getElementById("tabs");
  SPEC.flows.forEach(fl => {
    const b = document.createElement("button");
    b.className = "tab"; b.dataset.flow = fl.id; b.setAttribute("aria-pressed", "false");
    b.textContent = fl.title;
    b.addEventListener("click", () => setFlow(fl.id));
    tabs.appendChild(b);
  });
  function setFlow(id) {
    const fl = SPEC.flows.find(f => f.id === id);
    document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.flow === id)));
    document.getElementById("flowtitle").textContent = fl.caption || fl.title;
    document.getElementById("flowtext").innerHTML = fl.html || "";
    const over = id === "over";
    SPEC.edges.forEach(ed => {
      const on = over || (fl.edges || []).includes(ed._key);
      edgeEls[ed._key].classList.toggle("dimmed", !on);
      if (lblEls[ed._key]) lblEls[ed._key].style.display = (!over && on) ? "" : "none";
    });
    SPEC.nodes.forEach(n => {
      const on = over || (fl.nodes || []).includes(n.id);
      nodeEls[n.id].classList.toggle("dimmed", !on);
    });
  }
  setFlow(SPEC.flows[0].id);
})();
</script>

</body>
</html>
