<!DOCTYPE html>

<head>
  <meta charset="utf-8">

  <title>Not found · Doug Fessler</title>
  <script>
    // GitHub Pages has no server-side rewrites, so old paths are mapped here.
    // /smartplan/<page> and /smartplan-plugin/<page> keep their page under
    // /projects/smartplan/. The two folder stubs handle the bare paths.
    (function () {
      var m = location.pathname.match(/^\/(?:smartplan-plugin|smartplan)(\/.*)?$/);
      if (m) {
        location.replace('/projects/smartplan' + (m[1] || '/') + location.search + location.hash);
      }
    })();
  </script>
