name: Refresh Emulatarr feed

# Keeps projects/emulatarr/updates.json in step with the newest
# `installer-v*` release in defessler/game-rom-manager, which is what the
# product page's download button reads.
#
# Why a poll here rather than a push from the release workflow: pushing
# across repositories needs a PAT stored as a secret, and this needs no
# secret at all. Reading public releases is unauthenticated, and the
# built-in GITHUB_TOKEN can commit to this repo. The cost is a delay of
# up to the schedule interval, which is fine for a download link. Run the
# workflow by hand right after cutting a release if you want it now.

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-emulatarr-feed
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull the newest installer-v release feed
        env:
          # Only used for the rate limit. The repo is public, so this
          # would work unauthenticated too, just with a smaller budget.
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPO: defessler/game-rom-manager
        run: |
          python3 - <<'PY'
          import json, os, pathlib, urllib.request

          repo = os.environ['SOURCE_REPO']
          token = os.environ.get('GH_TOKEN', '')

          def get(url, raw=False):
              req = urllib.request.Request(url)
              req.add_header('Accept',
                             'application/octet-stream' if raw
                             else 'application/vnd.github+json')
              if token:
                  req.add_header('Authorization', f'Bearer {token}')
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.read()

          releases = json.loads(get(f'https://api.github.com/repos/{repo}/releases?per_page=100'))

          # Same filter the in-app updater uses: this repo also cuts plain
          # v* releases for the NAS scripts, and those are not the wizard.
          def version_key(rel):
              v = rel['tag_name'].removeprefix('installer-v')
              base = v.split('-', 1)[0]
              parts = [int(p) for p in base.split('.') if p.isdigit()]
              # A tag with a suffix (0.2.0-dev.3) sorts below the plain
              # 0.2.0 it leads up to.
              return (parts + [0, 0, 0])[:3] + [0 if '-' in v else 1]

          candidates = [r for r in releases
                        if r['tag_name'].startswith('installer-v') and not r['draft']]
          if not candidates:
              raise SystemExit('no installer-v releases found')
          newest = max(candidates, key=version_key)
          print(f"newest installer release: {newest['tag_name']}")

          asset = next((a for a in newest.get('assets', [])
                        if a['name'] == 'updates.json'), None)
          if asset is None:
              # Releases cut before the feed step existed have no asset.
              # Leave whatever is committed alone rather than writing a
              # half-built feed from the API.
              raise SystemExit(
                  f"{newest['tag_name']} has no updates.json asset - nothing to sync")

          feed = json.loads(get(asset['url'], raw=True))
          out = pathlib.Path('projects/emulatarr/updates.json')
          new = json.dumps(feed, indent=2) + '\n'
          if out.exists() and out.read_text(encoding='utf-8') == new:
              print('feed already current')
          else:
              out.parent.mkdir(parents=True, exist_ok=True)
              out.write_text(new, encoding='utf-8')
              print(f"updated {out} to v{feed['latest']['version']}")
          PY

      - name: Commit if it moved
        run: |
          if [ -z "$(git status --porcelain projects/emulatarr/updates.json)" ]; then
            echo "nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/emulatarr/updates.json
          git commit -m "Emulatarr: sync download feed to $(python3 -c "import json;print(json.load(open('projects/emulatarr/updates.json'))['latest']['tag'])")"
          git push
